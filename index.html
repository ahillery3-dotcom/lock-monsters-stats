<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#041E42"><link rel="manifest" href="manifest.webmanifest"><title>Lock Monsters HQ</title><style>:root{--n:#041E42;--b:#004C97;--r:#AC162C;--bg:#eef3f9;--m:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial;color:#0c1b2e}header{background:linear-gradient(135deg,var(--n),var(--b));color:white;padding:15px 18px;position:sticky;top:0}.ey{font-size:10px;letter-spacing:.28em;font-weight:800}.ti{font-size:23px;font-weight:900}.mo{font-size:11px}main{max-width:680px;margin:auto;padding:10px}.card{background:white;border-radius:18px;padding:14px;margin-bottom:9px;box-shadow:0 3px 12px #041e4212}h2{font-size:18px;margin:0 0 10px}label{display:block;font-size:12px;font-weight:800;color:var(--m);margin:6px 0}input,select{width:100%;padding:13px;border:1px solid #d7e0ea;border-radius:13px;font-size:16px;margin-bottom:8px}button{border:0;border-radius:15px;background:var(--b);color:white;min-height:52px;padding:12px;font-weight:900;font-size:15px}.full{width:100%}.secondary{background:var(--n)}.danger{background:var(--r)}.light{background:#e8f0fa;color:var(--n)}.actions,.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.players button{background:#edf4fb;color:var(--n);text-align:left}.players b{color:var(--b)}.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center}.num{font-size:52px;font-weight:900}.team{font-size:12px;font-weight:900}.sub{font-size:12px;color:var(--m)}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#e7f0fb;color:var(--b);font-size:11px;font-weight:900}.event,.row{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #edf1f5;padding:9px 0}.event:first-child,.row:first-child{border-top:0}.status{display:flex;justify-content:space-between;align-items:center}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}.on{background:#18864b}.off{background:var(--r)}.reportText{white-space:pre-wrap;font-size:13px;line-height:1.45;background:#f8fafc;border:1px solid #dfe7f0;border-radius:12px;padding:12px;max-height:360px;overflow:auto}.copyGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.reportMeta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.reportMeta>div{background:#f6f9fd;border-radius:12px;padding:10px;text-align:center}.reportMeta b{display:block;font-size:18px;color:var(--navy)}.dashGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dashTile{background:#fff;border-radius:18px;padding:16px;box-shadow:0 3px 12px rgba(4,30,66,.07);text-align:left;color:var(--navy);min-height:105px}.dashTile .icon{font-size:28px;display:block;margin-bottom:7px}.dashTile b{font-size:16px;display:block}.dashTile span{font-size:11px;color:var(--muted)}.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:20px;padding:16px;margin-bottom:10px}.hero .record{font-size:30px;font-weight:900}.playerCard{background:linear-gradient(135deg,#fff,#f4f8fc);border:1px solid #dfe8f3;border-radius:18px;padding:16px}.playerHead{display:flex;justify-content:space-between;gap:12px;align-items:center}.jerseyBig{font-size:34px;font-weight:900;color:var(--blue)}.statGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.statBox{background:#fff;border-radius:12px;padding:10px;text-align:center;border:1px solid #e3eaf2}.statBox b{display:block;font-size:20px;color:var(--navy)}.statBox span{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:800}.stars{font-size:20px;letter-spacing:1px}.awardCard{border-top:1px solid #edf1f5;padding:10px 0}.awardCard:first-child{border-top:0}.awardTitle{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase}.awardWinner{font-size:16px;font-weight:900;color:var(--navy);margin-top:2px}.awardReason{font-size:12px;color:var(--muted);margin-top:2px}.playerListBtn{width:100%;background:#edf4fb;color:var(--navy);text-align:left;margin-bottom:7px;min-height:50px}@media(max-width:380px){.players{grid-template-columns:1fr}.num{font-size:46px}}.brandHeader{display:flex;align-items:center;gap:11px}.brandHeader img{width:62px;height:62px;object-fit:contain;background:#fff;border-radius:14px;padding:4px}.heroLogo{display:block;width:min(270px,78vw);margin:0 auto 8px;filter:drop-shadow(0 5px 10px rgba(0,0,0,.18))}.splash{position:fixed;inset:0;background:linear-gradient(135deg,var(--n),var(--b));z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .25s}.splash.hide{opacity:0;pointer-events:none}.splashInner{text-align:center;color:#fff}.splashInner img{width:min(300px,78vw);max-height:44vh;object-fit:contain;background:#fff;border-radius:22px;padding:9px;box-shadow:0 16px 36px rgba(0,0,0,.25)}.splashTitle{font-size:26px;font-weight:900;margin-top:12px}.watermarkCard{position:relative;overflow:hidden}.watermarkCard:after{content:"";position:absolute;right:-18px;bottom:-28px;width:170px;height:170px;background:url('lock-monsters-logo.png') center/contain no-repeat;opacity:.07;pointer-events:none}.reportLogo{width:110px;display:block;margin:0 auto 9px}.starLogo{width:90px;display:block;margin:0 auto 8px}</style></head><body><div id="splash" class="splash"><div class="splashInner"><img src="lock-monsters-logo.png" alt="Lock Monsters logo"><div class="splashTitle">LOCK MONSTERS HQ</div><div class="mo">One Team. One Standard. No Excuses.</div></div></div><header><div class="brandHeader"><img src="lock-monsters-logo.png" alt="Lock Monsters logo"><div><div class="ey">LOCKPORT</div><div class="ti">LOCK MONSTERS HQ</div><div class="mo">One Team. One Standard. No Excuses.</div></div></div></header><main><div class="card status"><div><span id="dot" class="dot"></span><b id="net"></b></div><span class="pill" id="q">0 waiting</span></div><div id="app"></div></main><script>
const V='1.5.0';const SK=[['71','Jonathan Clark'],['11','Mark Corrao'],['8','Anson Czosek'],['88','Mason Dziura'],['97','Benjamin Ewart'],['14','Elliott Granville'],['23','Ryan Hillery'],['4','Brandyn Johnston'],['91','Alex Jordan'],['54','Noah Kennedy'],['29','Caden Mooradian'],['47','Blake Plewinski'],['41','Jack Sheehan'],['89','Callen Young'],['26','Maxwell Zhang']].map(x=>({jersey:x[0],name:x[1]}));const GK=[['30','Ayden Chase'],['33','Nathaniel Hillery']].map(x=>({jersey:x[0],name:x[1]}));const PENALTIES=['Elbowing','Interference','Tripping','Hooking','Slashing','Roughing','Cross-checking','Body-checking','Unsportsmanlike Conduct'];const PENALTY_MINUTES=[1,1.5,2];const SYNC_ENDPOINT='https://script.google.com/macros/s/AKfycbweFj24alET9wn1tKkhADoy_JROQapukEAKJ2MxKCQm3oUt2RGj1z837xu_9M1SEFvP/exec';const DB='lm-v12';let db,game=null,events=[],draft={},syncing=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();const now=()=>new Date().toISOString();const coach=()=>localStorage.getItem('coach')||'Coach';const dev=()=>{let d=localStorage.getItem('lmdev');if(!d){d=uid();localStorage.setItem('lmdev',d)}return d};const ready=()=>SYNC_ENDPOINT.startsWith('https://script.google.com/macros/s/')&&SYNC_ENDPOINT.endsWith('/exec');
function openDB(){return new Promise((ok,bad)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('game'))d.createObjectStore('game',{keyPath:'id'});if(!d.objectStoreNames.contains('events'))d.createObjectStore('events',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>bad(r.error)})}function st(n,m='readonly'){return db.transaction(n,m).objectStore(n)}function get(n,k){return new Promise((ok,bad)=>{let r=st(n).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)})}function put(n,v){return new Promise((ok,bad)=>{let r=st(n,'readwrite').put(v);r.onsuccess=()=>ok(v);r.onerror=()=>bad(r.error)})}function all(n){return new Promise((ok,bad)=>{let r=st(n).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)})}async function load(){game=await get('game','current')||null;events=await all('events')}async function saveGame(){if(game)await put('game',{...game,id:'current'})}async function saveEvent(e){await put('events',e);let i=events.findIndex(x=>x.id===e.id);if(i>=0)events[i]=e;else events.push(e)}
function mine(){return game?events.filter(e=>e.gameCode===game.gameCode&&!e.voided):[]}function unsynced(){return events.filter(e=>!e.synced)}function score(){let u=0,o=0;mine().forEach(e=>{if(e.type==='GOAL')u++;if(e.type==='OPP_GOAL')o++});return{u,o}}function gs(j){let e=mine().filter(x=>x.goalieJersey===j),s=e.filter(x=>x.type==='SAVE').length,ga=e.filter(x=>x.type==='OPP_GOAL').length,sh=s+ga;return{s,ga,sh,p:sh?s/sh:0}}
function status(){let on=navigator.onLine;document.getElementById('dot').className='dot '+(on?'on':'off');document.getElementById('net').textContent=syncing?'Syncing…':on?'Online':'Offline — scoring works';document.getElementById('q').textContent=unsynced().length+' waiting'}function render(){status();game?.status==='LIVE'?live():home()}function home(){document.getElementById('app').innerHTML=`<div class="hero"><img class="heroLogo" src="lock-monsters-logo.png" alt="Lock Monsters logo"><div class="record" id="dashRecord">—</div><div class="sub" style="color:#dbe8f7" id="dashMeta">Season dashboard</div></div><div class="dashGrid"><button class="dashTile" onclick="gameMenu()"><span class="icon">🏒</span><b>Live Game</b><span>Create or join a game</span></button><button class="dashTile" onclick="season()"><span class="icon">📊</span><b>Season Stats</b><span>Leaders and goalies</span></button><button class="dashTile" onclick="playerCards()"><span class="icon">👤</span><b>Player Cards</b><span>Individual player profiles</span></button><button class="dashTile" onclick="threeStarsMenu()"><span class="icon">⭐</span><b>Three Stars</b><span>Postgame stars</span></button><button class="dashTile" onclick="seasonAwards()"><span class="icon">🏆</span><b>Season Awards</b><span>Objective season leaders</span></button><button class="dashTile" onclick="archives()"><span class="icon">📰</span><b>Games & Stories</b><span>Box scores and recaps</span></button></div><div class="card" style="margin-top:10px"><div class="actions"><button class="light" onclick="sync()">↻ Sync</button><button class="light" onclick="loadDashboard()">Refresh Dashboard</button></div><div class="sub" style="margin-top:8px">PWA ${V}</div></div>`;loadDashboard()}
function gameMenu(){document.getElementById('app').innerHTML=`<div class="card"><h2>Create Game</h2><label>Opponent</label><input id="opp"><label>Date</label><input id="date" type="date" value="${today()}"><label>Coach</label><input id="coach" value="${esc(localStorage.getItem('coach')||'')}"><button class="full" onclick="create()">Create Game Code</button></div><div class="card"><h2>Join Existing Game</h2><label>Game Code</label><input id="joinCode" maxlength="6" style="text-transform:uppercase"><label>Coach</label><input id="joinCoach" value="${esc(localStorage.getItem('coach')||'')}"><button class="full secondary" onclick="join()">Join Game</button></div><button class="full secondary" onclick="home()">Back</button>`}
async function loadDashboard(){if(!navigator.onLine)return;try{let d=await jsonp({action:'dashboard'});if(!d.ok)return;let r=document.getElementById('dashRecord'),m=document.getElementById('dashMeta');if(r)r.textContent=d.record;if(m)m.textContent=`${d.gamesPlayed} GP · GF ${d.goalsFor} · GA ${d.goalsAgainst} · ${d.goalsPerGame.toFixed(2)} GF/G`;}catch(e){}}
async function createGame(){let o=document.getElementById('opp').value.trim(),d=document.getElementById('date').value,c=document.getElementById('coach').value.trim();if(!o||!d||!c)return alert('Enter opponent/date/coach');localStorage.setItem('coach',c);let x=await jsonp({action:'createGame',opponent:o,date:d,coach:c});game={id:'current',gameId:x.gameId,gameCode:x.gameCode,status:'LIVE',opponent:x.opponent,date:x.date,period:1,activeGoalieJersey:'',activeGoalieName:''};await saveGame();render()}async function joinGame(){let code=document.getElementById('code').value.trim().toUpperCase(),c=document.getElementById('jcoach').value.trim();localStorage.setItem('coach',c);let x=await jsonp({action:'joinGame',gameCode:code});if(!x.ok)return alert(x.error);game={id:'current',...x,activeGoalieJersey:x.activeGoalieJersey||'',activeGoalieName:x.activeGoalieName||''};await saveGame();await pull();render()}
function live(){let s=score(),g=game.activeGoalieJersey?gs(game.activeGoalieJersey):null;document.getElementById('app').innerHTML=`<div class="card"><div style="text-align:center"><span class="pill">PERIOD ${game.period}</span></div><div class="score"><div><div class="team">LOCK MONSTERS</div><div class="num">${s.u}</div></div><div>VS</div><div><div class="team">${esc(game.opponent).toUpperCase()}</div><div class="num">${s.o}</div></div></div><div class="sub" style="text-align:center">Goalie: ${game.activeGoalieName?`#${game.activeGoalieJersey} ${esc(game.activeGoalieName)} · ${g.s}/${g.sh} · ${(g.p*100).toFixed(1)}%`:'Not selected'} · Code ${game.gameCode}</div></div><div class="card actions"><button onclick="goalStart()">🥅 Goal</button><button class="danger" onclick="oppGoal()">❌ Opp Goal</button><button class="secondary" onclick="save()">🛑 Save</button><button class="light" onclick="goalie()">🥅 Goalie</button><button class="secondary" onclick="period()">⏱ Period</button><button class="danger" onclick="penaltyStart()">🚨 Penalty</button><button class="light" onclick="sync()">↻ Sync</button></div><div class="card"><h2>Timeline</h2>${mine().slice().reverse().slice(0,30).map(ev).join('')||'<div class="sub">No events yet.</div>'}</div><button class="full danger" onclick="finish()">Finish Game</button>`}function ev(e){let t=e.type;if(e.type==='GOAL')t=`GOAL — #${e.scorerJersey} ${esc(e.scorerName)}`;if(e.type==='SAVE')t=`SAVE — ${esc(e.goalieName)}`;if(e.type==='OPP_GOAL')t=`OPP GOAL${e.goalieName?' — '+esc(e.goalieName):''}`;if(e.type==='GOALIE_CHANGE')t=`GOALIE — #${e.goalieJersey} ${esc(e.goalieName)}`;if(e.type==='PENALTY')t=`PENALTY — #${e.penaltyPlayerJersey} ${esc(e.penaltyPlayerName)} · ${esc(e.penaltyType)} · ${formatPenaltyMinutes(e.penaltyMinutes)}`;return `<div class="event"><div><b>${t}</b><div class="sub">P${e.period} · ${esc(e.coach)}</div></div><span class="pill">${e.synced?'synced':'local'}</span></div>`}
function formatPenaltyMinutes(m){m=Number(m||0);return m===1.5?'1:30':m===1?'1:00':m===2?'2:00':String(m)}function penaltyStart(){draft={};pick('Player receiving penalty?',[],false,j=>{let p=SK.find(x=>x.jersey===j);draft.penaltyPlayerJersey=p.jersey;draft.penaltyPlayerName=p.name;penaltyTypePick()})}function penaltyTypePick(){document.getElementById('app').innerHTML=`<div class="card"><h2>Penalty Type</h2><div class="players">${PENALTIES.map((p,i)=>`<button onclick="penaltyTypeChosen(${i})">${esc(p)}</button>`).join('')}</div><button class="full secondary" style="margin-top:10px" onclick="live()">Cancel</button></div>`}function penaltyTypeChosen(i){draft.penaltyType=PENALTIES[i];document.getElementById('app').innerHTML=`<div class="card"><h2>Penalty Length</h2><div class="players">${PENALTY_MINUTES.map(m=>`<button onclick="penaltyMinutesChosen(${m})">${formatPenaltyMinutes(m)}</button>`).join('')}</div><button class="full secondary" style="margin-top:10px" onclick="live()">Cancel</button></div>`}async function penaltyMinutesChosen(m){draft.penaltyMinutes=Number(m);await add({type:'PENALTY',penaltyPlayerJersey:draft.penaltyPlayerJersey,penaltyPlayerName:draft.penaltyPlayerName,penaltyType:draft.penaltyType,penaltyMinutes:draft.penaltyMinutes})}function goalStart(){draft={};pick('Who scored?',[],false,j=>{draft.scorerJersey=j;pick('Primary assist',[j],true,a=>{draft.assist1Jersey=a;pick('Secondary assist',[j,a].filter(Boolean),true,goalSave)})})}function pick(title,ex,none,cb){document.getElementById('app').innerHTML=`<div class="card"><h2>${title}</h2>${none?`<button class="full light" onclick="window.pickCb('')">None</button>`:''}<div class="players">${SK.filter(p=>!ex.includes(p.jersey)).map(p=>`<button onclick="pickCb('${p.jersey}')"><b>#${p.jersey}</b> ${esc(p.name.split(' ').pop())}</button>`).join('')}</div></div>`;window.pickCb=cb}async function goalSave(a2){draft.assist2Jersey=a2;let s=SK.find(p=>p.jersey===draft.scorerJersey),a1=SK.find(p=>p.jersey===draft.assist1Jersey),a=SK.find(p=>p.jersey===a2);await add({type:'GOAL',scorerJersey:s.jersey,scorerName:s.name,assist1Jersey:a1?.jersey||'',assist1Name:a1?.name||'',assist2Jersey:a?.jersey||'',assist2Name:a?.name||''})}function goalie(){document.getElementById('app').innerHTML=`<div class="card"><h2>Select Active Goalie</h2><div class="players">${GK.map(g=>`<button onclick="setGoalie('${g.jersey}')"><b>#${g.jersey}</b> ${esc(g.name)}</button>`).join('')}</div></div>`}async function setGoalie(j){let g=GK.find(x=>x.jersey===j);game.activeGoalieJersey=j;game.activeGoalieName=g.name;await saveGame();await add({type:'GOALIE_CHANGE',goalieJersey:j,goalieName:g.name})}async function save(){if(!game.activeGoalieJersey)return alert('Select goalie first');await add({type:'SAVE',goalieJersey:game.activeGoalieJersey,goalieName:game.activeGoalieName})}async function oppGoal(){await add({type:'OPP_GOAL',goalieJersey:game.activeGoalieJersey||'',goalieName:game.activeGoalieName||''})}async function period(){let p=Number(prompt('Period 1-5',game.period));if(![1,2,3,4,5].includes(p))return;game.period=p;await saveGame();await add({type:'PERIOD_CHANGE',period:p})}async function add(x){let e={id:uid(),gameId:game.gameId,gameCode:game.gameCode,createdAt:now(),coach:coach(),deviceId:dev(),period:x.period||game.period,synced:false,voided:false,...x};await saveEvent(e);render();sync()}async function finish(){if(!confirm('Finish game?'))return;game.status='FINAL';await saveGame();await add({type:'GAME_FINISH'});home()}
async function push(e){let d=await jsonp({action:'push',payload:JSON.stringify(e)});if(d.ok){e.synced=true;await saveEvent(e)}}async function pull(){if(!game||!navigator.onLine)return;let d=await jsonp({action:'pull',gameCode:game.gameCode});if(!d.ok)return;if(d.game){game.status=d.game.status;game.period=d.game.period;game.activeGoalieJersey=d.game.activeGoalieJersey||game.activeGoalieJersey;game.activeGoalieName=d.game.activeGoalieName||game.activeGoalieName;await saveGame()}for(let r of d.events||[])if(!events.some(e=>e.id===r.id)){r.synced=true;await saveEvent(r)}}async function sync(){if(syncing||!navigator.onLine||!ready())return;syncing=true;status();try{for(let e of unsynced().slice())await push(e);await pull()}finally{syncing=false;render()}}
async function season(){let d=await jsonp({action:'seasonSummary'});document.getElementById('app').innerHTML=`<div class="card"><h2>Season Leaders</h2>${d.skaters.map(p=>`<div class="row"><span>#${p.jersey} ${esc(p.name)}</span><b>${p.goals}G ${p.assists}A ${p.points}P · ${Number(p.pim||0).toFixed((p.pim||0)%1?1:0)} PIM</b></div>`).join('')}</div><div class="card"><h2>Goalies</h2>${d.goalies.map(g=>`<div class="row"><span>#${g.jersey} ${esc(g.name)}</span><b>${g.saves}/${g.shots} · ${(g.savePct*100).toFixed(1)}%</b></div>`).join('')}</div><button class="full secondary" onclick="home()">Back</button>`}async function archives(){let d=await jsonp({action:'listGames'});document.getElementById('app').innerHTML=`<div class="card"><h2>Archived Games</h2>${d.games.map(g=>`<div class="row" onclick="summary('${g.gameCode}')"><span>${esc(g.date)} · ${esc(g.opponent)}</span><b>${g.teamGoals}-${g.oppGoals} ${g.result}</b></div>`).join('')||'<div class="sub">No finished games.</div>'}</div><button class="full secondary" onclick="home()">Back</button>`}async function summary(c){let d=await jsonp({action:'gameSummary',gameCode:c});document.getElementById('app').innerHTML=`<div class="card"><h2>${esc(d.game.opponent)} — ${d.game.teamGoals}-${d.game.oppGoals}</h2>${d.skaters.filter(p=>p.points||p.pim).map(p=>`<div class="row"><span>#${p.jersey} ${esc(p.name)}</span><b>${p.goals}G ${p.assists}A ${p.points}P · ${Number(p.pim||0).toFixed((p.pim||0)%1?1:0)} PIM</b></div>`).join('')||'<div class="sub">No skater scoring or penalties recorded.</div>'}</div><div class="card"><h2>Goalies</h2>${d.goalies.filter(g=>g.shots).map(g=>`<div class="row"><span>#${g.jersey} ${esc(g.name)}</span><b>${g.saves}/${g.shots} · ${(g.savePct*100).toFixed(1)}%</b></div>`).join('')||'<div class="sub">No goalie shots recorded.</div>'}</div><div class="card actions"><button onclick="postgameReport('${c}')">📰 Postgame Report</button><button class="secondary" onclick="archives()">Back</button></div>`}
function fmtPim(v){v=Number(v||0);return v%1?v.toFixed(1):String(v)}
function goalieLine(g){return `#${g.jersey} ${g.name} — ${g.saves} saves on ${g.shots} shots (${(g.savePct*100).toFixed(1)}% SV%)`}
function buildBoxScore(r){let lines=[`LOCK MONSTERS ${r.game.teamGoals} — ${r.game.oppGoals} ${r.game.opponent}`,`${r.game.date} · ${r.game.result}`,``, `SCORING`];let scorers=r.skaters.filter(p=>p.points).sort((a,b)=>b.points-a.points||b.goals-a.goals);if(scorers.length)scorers.forEach(p=>lines.push(`#${p.jersey} ${p.name}: ${p.goals} G, ${p.assists} A, ${p.points} P`));else lines.push('No Lock Monsters scoring recorded.');lines.push('', 'GOALTENDING');let goalies=r.goalies.filter(g=>g.shots);if(goalies.length)goalies.forEach(g=>lines.push(goalieLine(g)));else lines.push('No goalie shots recorded.');lines.push('', 'PENALTIES');if(r.penalties.length)r.penalties.forEach(p=>lines.push(`#${p.jersey} ${p.name} — ${p.type}, ${p.displayMinutes}`));else lines.push('No penalties recorded.');lines.push('',`TEAM RECORD: ${r.season.record} · GF ${r.season.goalsFor} · GA ${r.season.goalsAgainst}`);return lines.join('\n')}
function buildSocialData(r){let scorers=r.skaters.filter(p=>p.points).sort((a,b)=>b.points-a.points||b.goals-a.goals).map(p=>`${p.name} ${p.goals}G/${p.assists}A`).join('; ')||'No Lock Monsters scoring recorded';let goalies=r.goalies.filter(g=>g.shots).map(goalieLine).join('; ')||'No goalie shots recorded';return `FINAL: Lock Monsters ${r.game.teamGoals}, ${r.game.opponent} ${r.game.oppGoals}\nScoring: ${scorers}\nGoalies: ${goalies}\nPenalties: ${r.penalties.length?r.penalties.map(p=>`${p.name} — ${p.type} ${p.displayMinutes}`).join('; '):'None recorded'}\nSeason record: ${r.season.record}`}
function buildChatGPTPrompt(r){let timeline=r.scoringTimeline.length?r.scoringTimeline.map(x=>x.text).join('\n'):'No scoring timeline recorded.';let penalties=r.penalties.length?r.penalties.map(p=>`- P${p.period}: #${p.jersey} ${p.name} — ${p.type}, ${p.displayMinutes}`).join('\n'):'- None recorded';let skaters=r.skaters.filter(p=>p.points||p.pim).sort((a,b)=>b.points-a.points||b.goals-a.goals).map(p=>`- #${p.jersey} ${p.name}: ${p.goals} G, ${p.assists} A, ${p.points} P, ${fmtPim(p.pim)} PIM`).join('\n')||'- No skater scoring or penalties recorded';let goalies=r.goalies.filter(g=>g.shots).map(g=>`- ${goalieLine(g)}`).join('\n')||'- No goalie shots recorded';let periods=r.periods.map(p=>`P${p.period}: Lock Monsters ${p.teamGoals}, ${r.game.opponent} ${p.oppGoals}`).join('\n')||'No period scoring recorded.';return `Write a polished postgame hockey package using ONLY the verified facts below.

STYLE:
Use energetic, concise sports-page and classic highlight-show pacing: strong headline, lively transitions, memorable but family-friendly phrasing, and a sense of momentum. Do not imitate any specific broadcaster, host, writer, or copyrighted catchphrase. Do not invent quotes, play descriptions, shot quality, crowd reactions, injuries, milestones, standings implications, or other facts that are not supplied.

OUTPUT EXACTLY THESE FOUR SECTIONS:
1. HEADLINE — one strong headline.
2. GAME STORY — 4 to 6 paragraphs suitable for parents/team website. Mention the most important scoring and goaltending performances naturally.
3. SOCIAL POST — approximately 80 to 130 words, ready to paste into a team social post.
4. BOX SCORE — concise, clean statistical summary.

VERIFIED GAME DATA
Team: Lockport Lock Monsters
Opponent: ${r.game.opponent}
Date: ${r.game.date}
Final: Lock Monsters ${r.game.teamGoals}, ${r.game.opponent} ${r.game.oppGoals}
Result: ${r.game.result}
Current season record after this game: ${r.season.record}
Season goals for / against: ${r.season.goalsFor} / ${r.season.goalsAgainst}

PERIOD SCORING
${periods}

LOCK MONSTERS PLAYER LINES
${skaters}

GOALTENDING
${goalies}

PENALTIES
${penalties}

SCORING TIMELINE
${timeline}

If the supplied data does not support a narrative claim, leave it out. Accuracy is more important than drama.`}
async function copyText(text,label){try{await navigator.clipboard.writeText(text);alert(label+' copied. Paste it into ChatGPT.')}catch(e){let ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert(label+' copied. Paste it into ChatGPT.')}}
async function postgameReport(c){let r=await jsonp({action:'postgameReport',gameCode:c});if(!r.ok){alert(r.error||'Could not build report');return}window.__report=r;let prompt=buildChatGPTPrompt(r),box=buildBoxScore(r),social=buildSocialData(r);window.__prompt=prompt;window.__box=box;window.__social=social;document.getElementById('app').innerHTML=`<div class="card"><img class="reportLogo" src="lock-monsters-logo.png" alt="Lock Monsters logo"><h2>📰 Postgame Report</h2><div class="reportMeta"><div><span class="sub">Final</span><b>${r.game.teamGoals}-${r.game.oppGoals}</b></div><div><span class="sub">Record</span><b>${esc(r.season.record)}</b></div></div><div class="sub" style="margin-top:10px">This prompt contains the verified game data and writing instructions. Copy it into ChatGPT to generate the full story.</div></div><div class="card"><h2>ChatGPT Recap Prompt</h2><div class="reportText">${esc(prompt)}</div><button class="full" style="margin-top:10px" onclick="copyText(window.__prompt,'ChatGPT recap prompt')">Copy ChatGPT Prompt</button></div><div class="card"><h2>Quick Copy</h2><div class="copyGrid"><button class="light" onclick="copyText(window.__box,'Box score')">Copy Box Score</button><button class="light" onclick="copyText(window.__social,'Social summary data')">Copy Social Data</button></div></div><button class="full secondary" onclick="summary('${c}')">Back to Box Score</button>`}

async function playerCards(){if(!navigator.onLine){alert('Player cards need a connection.');return}let d=await jsonp({action:'playerCards'});if(!d.ok){alert(d.error||'Could not load player cards');return}window.__players=d.players;document.getElementById('app').innerHTML=`<div class="card"><h2>Player Cards</h2>${d.players.map((p,i)=>`<button class="playerListBtn" onclick="showPlayerCard(${i})"><b>#${p.jersey}</b> ${esc(p.name)} <span style="float:right">${p.points} P</span></button>`).join('')}</div><button class="full secondary" onclick="home()">Back</button>`}
function showPlayerCard(i){let p=window.__players[i];let last=p.last5||[];document.getElementById('app').innerHTML=`<div class="playerCard watermarkCard"><div class="playerHead"><div><div class="sub">LOCK MONSTERS PLAYER</div><div style="font-size:22px;font-weight:900">${esc(p.name)}</div></div><div class="jerseyBig">#${p.jersey}</div></div><div class="statGrid"><div class="statBox"><b>${p.gamesPlayed}</b><span>GP</span></div><div class="statBox"><b>${p.goals}</b><span>Goals</span></div><div class="statBox"><b>${p.assists}</b><span>Assists</span></div><div class="statBox"><b>${p.points}</b><span>Points</span></div><div class="statBox"><b>${Number(p.pim||0).toFixed((p.pim||0)%1?1:0)}</b><span>PIM</span></div><div class="statBox"><b>${p.ppg.toFixed(2)}</b><span>PPG</span></div></div></div><div class="card"><h2>Last 5 Games</h2>${last.length?last.map(g=>`<div class="row"><span>${esc(g.date)} vs ${esc(g.opponent)}</span><b>${g.goals}G ${g.assists}A ${g.points}P</b></div>`).join(''):'<div class="sub">No completed games yet.</div>'}</div><div class="card"><h2>Season Notes</h2><div class="row"><span>Best points game</span><b>${p.bestGamePoints} P</b></div><div class="row"><span>Penalty count</span><b>${p.penalties}</b></div></div><button class="full secondary" onclick="playerCards()">Back</button>`}
async function threeStarsMenu(){if(!navigator.onLine){alert('Three Stars need a connection.');return}let d=await jsonp({action:'listGames'});if(!d.ok){alert(d.error||'Could not load games');return}document.getElementById('app').innerHTML=`<div class="card"><h2>Three Stars</h2>${d.games.length?d.games.map(g=>`<button class="playerListBtn" onclick="threeStars('${g.gameCode}')">${esc(g.date)} · ${esc(g.opponent)} <span style="float:right">${g.teamGoals}-${g.oppGoals}</span></button>`).join(''):'<div class="sub">No completed games yet.</div>'}</div><button class="full secondary" onclick="home()">Back</button>`}
async function threeStars(code){let d=await jsonp({action:'threeStars',gameCode:code});if(!d.ok){alert(d.error||'Could not calculate stars');return}document.getElementById('app').innerHTML=`<div class="card"><img class="starLogo" src="lock-monsters-logo.png" alt="Lock Monsters logo"><h2>Three Stars — ${esc(d.game.opponent)}</h2>${d.stars.map((s,i)=>`<div class="awardCard"><div class="stars">${i===0?'⭐⭐⭐':i===1?'⭐⭐':'⭐'}</div><div class="awardWinner">#${s.jersey} ${esc(s.name)}</div><div class="awardReason">${esc(s.reason)}</div></div>`).join('')}</div><div class="card"><div class="sub">Stars are calculated from verified game stats using a transparent scoring formula; coaches can treat them as suggested selections.</div></div><button class="full secondary" onclick="threeStarsMenu()">Back</button>`}
async function seasonAwards(){if(!navigator.onLine){alert('Season Awards need a connection.');return}let d=await jsonp({action:'seasonAwards'});if(!d.ok){alert(d.error||'Could not load awards');return}document.getElementById('app').innerHTML=`<div class="card"><img class="starLogo" src="lock-monsters-logo.png" alt="Lock Monsters logo"><h2>Season Awards</h2>${d.awards.map(a=>`<div class="awardCard"><div class="awardTitle">${esc(a.title)}</div><div class="awardWinner">#${a.jersey} ${esc(a.name)}</div><div class="awardReason">${esc(a.reason)}</div></div>`).join('')}</div><div class="card"><div class="sub">These awards are based only on recorded statistics. Subjective awards such as leadership or effort are intentionally left to the coaching staff.</div></div><button class="full secondary" onclick="home()">Back</button>`}
window.addEventListener('online',sync);window.addEventListener('offline',status);(async()=>{await openDB();await load();if('serviceWorker'in navigator)try{await navigator.serviceWorker.register('./sw.js')}catch{}render();setInterval(()=>{if(game?.status==='LIVE')sync()},15000);setTimeout(sync,500);setTimeout(()=>{let s=document.getElementById('splash');if(s){s.classList.add('hide');setTimeout(()=>s.remove(),300)}},900)})();
</script></body></html>
