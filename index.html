<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#041E42"><link rel="manifest" href="manifest.webmanifest"><title>Lock Monsters Stats</title><style>:root{--n:#041E42;--b:#004C97;--r:#AC162C;--bg:#eef3f9;--m:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial;color:#0c1b2e}header{background:linear-gradient(135deg,var(--n),var(--b));color:white;padding:15px 18px;position:sticky;top:0}.ey{font-size:10px;letter-spacing:.28em;font-weight:800}.ti{font-size:23px;font-weight:900}.mo{font-size:11px}main{max-width:680px;margin:auto;padding:10px}.card{background:white;border-radius:18px;padding:14px;margin-bottom:9px;box-shadow:0 3px 12px #041e4212}h2{font-size:18px;margin:0 0 10px}label{display:block;font-size:12px;font-weight:800;color:var(--m);margin:6px 0}input,select{width:100%;padding:13px;border:1px solid #d7e0ea;border-radius:13px;font-size:16px;margin-bottom:8px}button{border:0;border-radius:15px;background:var(--b);color:white;min-height:52px;padding:12px;font-weight:900;font-size:15px}.full{width:100%}.secondary{background:var(--n)}.danger{background:var(--r)}.light{background:#e8f0fa;color:var(--n)}.actions,.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.players button{background:#edf4fb;color:var(--n);text-align:left}.players b{color:var(--b)}.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center}.num{font-size:52px;font-weight:900}.team{font-size:12px;font-weight:900}.sub{font-size:12px;color:var(--m)}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#e7f0fb;color:var(--b);font-size:11px;font-weight:900}.event,.row{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #edf1f5;padding:9px 0}.event:first-child,.row:first-child{border-top:0}.status{display:flex;justify-content:space-between;align-items:center}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}.on{background:#18864b}.off{background:var(--r)}@media(max-width:380px){.players{grid-template-columns:1fr}.num{font-size:46px}}</style></head><body><header><div class="ey">LOCKPORT</div><div class="ti">LOCK MONSTERS</div><div class="mo">One Team. One Standard. No Excuses.</div></header><main><div class="card status"><div><span id="dot" class="dot"></span><b id="net"></b></div><span class="pill" id="q">0 waiting</span></div><div id="app"></div></main><script>
const V='1.1.0';const SK=[['71','Jonathan Clark'],['11','Mark Corrao'],['8','Anson Czosek'],['88','Mason Dziura'],['97','Benjamin Ewart'],['14','Elliott Granville'],['23','Ryan Hillery'],['4','Brandyn Johnston'],['91','Alex Jordan'],['54','Noah Kennedy'],['29','Caden Mooradian'],['47','Blake Plewinski'],['41','Jack Sheehan'],['89','Callen Young'],['26','Maxwell Zhang']].map(x=>({jersey:x[0],name:x[1]}));const GK=[['30','Ayden Chase'],['33','Nathaniel Hillery']].map(x=>({jersey:x[0],name:x[1]}));const SYNC_ENDPOINT='https://script.google.com/macros/s/AKfycbweFj24alET9wn1tKkhADoy_JROQapukEAKJ2MxKCQm3oUt2RGj1z837xu_9M1SEFvP/exec';const DB='lm-v11';let db,game=null,events=[],draft={},syncing=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();const now=()=>new Date().toISOString();const coach=()=>localStorage.getItem('coach')||'Coach';const dev=()=>{let d=localStorage.getItem('lmdev');if(!d){d=uid();localStorage.setItem('lmdev',d)}return d};const ready=()=>SYNC_ENDPOINT.startsWith('https://script.google.com/macros/s/')&&SYNC_ENDPOINT.endsWith('/exec');
function openDB(){return new Promise((ok,bad)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('game'))d.createObjectStore('game',{keyPath:'id'});if(!d.objectStoreNames.contains('events'))d.createObjectStore('events',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>bad(r.error)})}function st(n,m='readonly'){return db.transaction(n,m).objectStore(n)}function get(n,k){return new Promise((ok,bad)=>{let r=st(n).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)})}function put(n,v){return new Promise((ok,bad)=>{let r=st(n,'readwrite').put(v);r.onsuccess=()=>ok(v);r.onerror=()=>bad(r.error)})}function all(n){return new Promise((ok,bad)=>{let r=st(n).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)})}async function load(){game=await get('game','current')||null;events=await all('events')}async function saveGame(){if(game)await put('game',{...game,id:'current'})}async function saveEvent(e){await put('events',e);let i=events.findIndex(x=>x.id===e.id);if(i>=0)events[i]=e;else events.push(e)}
function mine(){return game?events.filter(e=>e.gameCode===game.gameCode&&!e.voided):[]}function unsynced(){return events.filter(e=>!e.synced)}function score(){let u=0,o=0;mine().forEach(e=>{if(e.type==='GOAL')u++;if(e.type==='OPP_GOAL')o++});return{u,o}}function gs(j){let e=mine().filter(x=>x.goalieJersey===j),s=e.filter(x=>x.type==='SAVE').length,ga=e.filter(x=>x.type==='OPP_GOAL').length,sh=s+ga;return{s,ga,sh,p:sh?s/sh:0}}
function status(){let on=navigator.onLine;document.getElementById('dot').className='dot '+(on?'on':'off');document.getElementById('net').textContent=syncing?'Syncing…':on?'Online':'Offline — scoring works';document.getElementById('q').textContent=unsynced().length+' waiting'}function render(){status();game?.status==='LIVE'?live():home()}function home(){document.getElementById('app').innerHTML=`<div class="card"><h2>Create Game</h2><label>Opponent</label><input id="opp"><label>Date</label><input id="date" type="date"><label>Coach</label><input id="coach" value="${esc(localStorage.getItem('coach')||'')}"><button class="full" onclick="createGame()">Create Game Code</button></div><div class="card"><h2>Join Game</h2><label>Game Code</label><input id="code"><label>Coach</label><input id="jcoach" value="${esc(localStorage.getItem('coach')||'')}"><button class="full secondary" onclick="joinGame()">Join Game</button></div><div class="card actions"><button class="light" onclick="season()">Season</button><button class="light" onclick="archives()">Games</button></div><div class="sub">PWA ${V}</div>`;document.getElementById('date').value=new Date().toISOString().slice(0,10)}
function jsonp(p,t=12000){return new Promise((ok,bad)=>{if(!ready())return bad(new Error('Sync endpoint not configured'));let cb='lm'+Date.now()+Math.random().toString(16).slice(2),s=document.createElement('script'),to=setTimeout(()=>cl(new Error('Timeout')),t);function cl(e,d){clearTimeout(to);delete window[cb];s.remove();e?bad(e):ok(d)}window[cb]=d=>cl(null,d);p.callback=cb;s.onerror=()=>cl(new Error('Network error'));s.src=SYNC_ENDPOINT+'?'+new URLSearchParams(p);document.body.appendChild(s)})}
async function createGame(){let o=document.getElementById('opp').value.trim(),d=document.getElementById('date').value,c=document.getElementById('coach').value.trim();if(!o||!d||!c)return alert('Enter opponent/date/coach');localStorage.setItem('coach',c);let x=await jsonp({action:'createGame',opponent:o,date:d,coach:c});game={id:'current',gameId:x.gameId,gameCode:x.gameCode,status:'LIVE',opponent:x.opponent,date:x.date,period:1,activeGoalieJersey:'',activeGoalieName:''};await saveGame();render()}async function joinGame(){let code=document.getElementById('code').value.trim().toUpperCase(),c=document.getElementById('jcoach').value.trim();localStorage.setItem('coach',c);let x=await jsonp({action:'joinGame',gameCode:code});if(!x.ok)return alert(x.error);game={id:'current',...x,activeGoalieJersey:x.activeGoalieJersey||'',activeGoalieName:x.activeGoalieName||''};await saveGame();await pull();render()}
function live(){let s=score(),g=game.activeGoalieJersey?gs(game.activeGoalieJersey):null;document.getElementById('app').innerHTML=`<div class="card"><div style="text-align:center"><span class="pill">PERIOD ${game.period}</span></div><div class="score"><div><div class="team">LOCK MONSTERS</div><div class="num">${s.u}</div></div><div>VS</div><div><div class="team">${esc(game.opponent).toUpperCase()}</div><div class="num">${s.o}</div></div></div><div class="sub" style="text-align:center">Goalie: ${game.activeGoalieName?`#${game.activeGoalieJersey} ${esc(game.activeGoalieName)} · ${g.s}/${g.sh} · ${(g.p*100).toFixed(1)}%`:'Not selected'} · Code ${game.gameCode}</div></div><div class="card actions"><button onclick="goalStart()">🥅 Goal</button><button class="danger" onclick="oppGoal()">❌ Opp Goal</button><button class="secondary" onclick="save()">🛑 Save</button><button class="light" onclick="goalie()">🥅 Goalie</button><button class="secondary" onclick="period()">⏱ Period</button><button class="light" onclick="sync()">↻ Sync</button></div><div class="card"><h2>Timeline</h2>${mine().slice().reverse().slice(0,30).map(ev).join('')||'<div class="sub">No events yet.</div>'}</div><button class="full danger" onclick="finish()">Finish Game</button>`}function ev(e){let t=e.type;if(e.type==='GOAL')t=`GOAL — #${e.scorerJersey} ${esc(e.scorerName)}`;if(e.type==='SAVE')t=`SAVE — ${esc(e.goalieName)}`;if(e.type==='OPP_GOAL')t=`OPP GOAL${e.goalieName?' — '+esc(e.goalieName):''}`;if(e.type==='GOALIE_CHANGE')t=`GOALIE — #${e.goalieJersey} ${esc(e.goalieName)}`;return `<div class="event"><div><b>${t}</b><div class="sub">P${e.period} · ${esc(e.coach)}</div></div><span class="pill">${e.synced?'synced':'local'}</span></div>`}
function goalStart(){draft={};pick('Who scored?',[],false,j=>{draft.scorerJersey=j;pick('Primary assist',[j],true,a=>{draft.assist1Jersey=a;pick('Secondary assist',[j,a].filter(Boolean),true,goalSave)})})}function pick(title,ex,none,cb){document.getElementById('app').innerHTML=`<div class="card"><h2>${title}</h2>${none?'<button class="full light" onclick="pickCb('')">None</button>':''}<div class="players">${SK.filter(p=>!ex.includes(p.jersey)).map(p=>`<button onclick="pickCb('${p.jersey}')"><b>#${p.jersey}</b> ${esc(p.name.split(' ').pop())}</button>`).join('')}</div></div>`;window.pickCb=cb}async function goalSave(a2){draft.assist2Jersey=a2;let s=SK.find(p=>p.jersey===draft.scorerJersey),a1=SK.find(p=>p.jersey===draft.assist1Jersey),a=SK.find(p=>p.jersey===a2);await add({type:'GOAL',scorerJersey:s.jersey,scorerName:s.name,assist1Jersey:a1?.jersey||'',assist1Name:a1?.name||'',assist2Jersey:a?.jersey||'',assist2Name:a?.name||''})}function goalie(){document.getElementById('app').innerHTML=`<div class="card"><h2>Select Active Goalie</h2><div class="players">${GK.map(g=>`<button onclick="setGoalie('${g.jersey}')"><b>#${g.jersey}</b> ${esc(g.name)}</button>`).join('')}</div></div>`}async function setGoalie(j){let g=GK.find(x=>x.jersey===j);game.activeGoalieJersey=j;game.activeGoalieName=g.name;await saveGame();await add({type:'GOALIE_CHANGE',goalieJersey:j,goalieName:g.name})}async function save(){if(!game.activeGoalieJersey)return alert('Select goalie first');await add({type:'SAVE',goalieJersey:game.activeGoalieJersey,goalieName:game.activeGoalieName})}async function oppGoal(){await add({type:'OPP_GOAL',goalieJersey:game.activeGoalieJersey||'',goalieName:game.activeGoalieName||''})}async function period(){let p=Number(prompt('Period 1-5',game.period));if(![1,2,3,4,5].includes(p))return;game.period=p;await saveGame();await add({type:'PERIOD_CHANGE',period:p})}async function add(x){let e={id:uid(),gameId:game.gameId,gameCode:game.gameCode,createdAt:now(),coach:coach(),deviceId:dev(),period:x.period||game.period,synced:false,voided:false,...x};await saveEvent(e);render();sync()}async function finish(){if(!confirm('Finish game?'))return;game.status='FINAL';await saveGame();await add({type:'GAME_FINISH'});home()}
async function push(e){let d=await jsonp({action:'push',payload:JSON.stringify(e)});if(d.ok){e.synced=true;await saveEvent(e)}}async function pull(){if(!game||!navigator.onLine)return;let d=await jsonp({action:'pull',gameCode:game.gameCode});if(!d.ok)return;if(d.game){game.status=d.game.status;game.period=d.game.period;game.activeGoalieJersey=d.game.activeGoalieJersey||game.activeGoalieJersey;game.activeGoalieName=d.game.activeGoalieName||game.activeGoalieName;await saveGame()}for(let r of d.events||[])if(!events.some(e=>e.id===r.id)){r.synced=true;await saveEvent(r)}}async function sync(){if(syncing||!navigator.onLine||!ready())return;syncing=true;status();try{for(let e of unsynced().slice())await push(e);await pull()}finally{syncing=false;render()}}
async function season(){let d=await jsonp({action:'seasonSummary'});document.getElementById('app').innerHTML=`<div class="card"><h2>Season Leaders</h2>${d.skaters.map(p=>`<div class="row"><span>#${p.jersey} ${esc(p.name)}</span><b>${p.goals}G ${p.assists}A ${p.points}P</b></div>`).join('')}</div><div class="card"><h2>Goalies</h2>${d.goalies.map(g=>`<div class="row"><span>#${g.jersey} ${esc(g.name)}</span><b>${g.saves}/${g.shots} · ${(g.savePct*100).toFixed(1)}%</b></div>`).join('')}</div><button class="full secondary" onclick="home()">Back</button>`}async function archives(){let d=await jsonp({action:'listGames'});document.getElementById('app').innerHTML=`<div class="card"><h2>Archived Games</h2>${d.games.map(g=>`<div class="row" onclick="summary('${g.gameCode}')"><span>${esc(g.date)} · ${esc(g.opponent)}</span><b>${g.teamGoals}-${g.oppGoals} ${g.result}</b></div>`).join('')||'<div class="sub">No finished games.</div>'}</div><button class="full secondary" onclick="home()">Back</button>`}async function summary(c){let d=await jsonp({action:'gameSummary',gameCode:c});document.getElementById('app').innerHTML=`<div class="card"><h2>${esc(d.game.opponent)} — ${d.game.teamGoals}-${d.game.oppGoals}</h2>${d.skaters.filter(p=>p.points).map(p=>`<div class="row"><span>#${p.jersey} ${esc(p.name)}</span><b>${p.goals}G ${p.assists}A ${p.points}P</b></div>`).join('')}</div><div class="card"><h2>Goalies</h2>${d.goalies.map(g=>`<div class="row"><span>#${g.jersey} ${esc(g.name)}</span><b>${g.saves}/${g.shots} · ${(g.savePct*100).toFixed(1)}%</b></div>`).join('')}</div><button class="full secondary" onclick="archives()">Back</button>`}
window.addEventListener('online',sync);window.addEventListener('offline',status);(async()=>{await openDB();await load();if('serviceWorker'in navigator)try{await navigator.serviceWorker.register('./sw.js')}catch{}render();setInterval(()=>{if(game?.status==='LIVE')sync()},15000);setTimeout(sync,500)})();
</script></body></html>
