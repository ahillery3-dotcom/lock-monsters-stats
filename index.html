const V='1.7.0';const SK=[['71','Jonathan Clark'],['11','Mark Corrao'],['8','Anson Czosek'],['88','Mason Dziura'],['97','Benjamin Ewart'],['14','Elliott Granville'],['23','Ryan Hillery'],['4','Brandyn Johnston'],['91','Alex Jordan'],['54','Noah Kennedy'],['29','Caden Mooradian'],['47','Blake Plewinski'],['41','Jack Sheehan'],['89','Callen Young'],['26','Maxwell Zhang']].map(x=>({jersey:x[0],name:x[1]}));const GK=[['30','Ayden Chase'],['33','Nathaniel Hillery']].map(x=>({jersey:x[0],name:x[1]}));const PENALTIES=['Elbowing','Interference','Tripping','Hooking','Slashing','Roughing','Cross-checking','Body-checking','Unsportsmanlike Conduct'];const PENALTY_MINUTES=[1,1.5,2];const SYNC_ENDPOINT='https://script.google.com/macros/s/AKfycbweFj24alET9wn1tKkhADoy_JROQapukEAKJ2MxKCQm3oUt2RGj1z837xu_9M1SEFvP/exec';const DB='lm-v12';let db,game=null,events=[],draft={},syncing=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();const now=()=>new Date().toISOString();const today=()=>{let d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};const easternGameLabel=(date,time='19:00')=>{if(!date)return'';let y,mo,da;if(typeof date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(date)){let p=date.split('-').map(Number);y=p[0];mo=p[1]-1;da=p[2]}else{let parsed=new Date(date);if(Number.isNaN(parsed.getTime()))return String(date);y=parsed.getFullYear();mo=parsed.getMonth();da=parsed.getDate()}let tm=String(time||'19:00'),mt=tm.match(/(\d{1,2}):(\d{2})/),hh=mt?Number(mt[1]):19,mm=mt?Number(mt[2]):0,dt=new Date(y,mo,da,hh,mm,0,0);let day=['SUN','MON','TUE','WED','THU','FRI','SAT'][dt.getDay()],mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()],h=dt.getHours(),mins=String(dt.getMinutes()).padStart(2,'0'),ap=h>=12?'PM':'AM',h12=h%12||12,jan=new Date(dt.getFullYear(),0,1).getTimezoneOffset(),jul=new Date(dt.getFullYear(),6,1).getTimezoneOffset(),zone=dt.getTimezoneOffset()<Math.max(jan,jul)?'EDT':'EST';return `${day} ${mon} ${String(dt.getDate()).padStart(2,'0')} ${dt.getFullYear()} ${h12}:${mins} ${ap} (${zone})`};const coach=()=>localStorage.getItem('coach')||'Coach';const dev=()=>{let d=localStorage.getItem('lmdev');if(!d){d=uid();localStorage.setItem('lmdev',d)}return d};const ready=()=>SYNC_ENDPOINT.startsWith('https://script.google.com/macros/s/')&&SYNC_ENDPOINT.endsWith('/exec');
function openDB(){return new Promise((ok,bad)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('game'))d.createObjectStore('game',{keyPath:'id'});if(!d.objectStoreNames.contains('events'))d.createObjectStore('events',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>bad(r.error)})}function st(n,m='readonly'){return db.transaction(n,m).objectStore(n)}function get(n,k){return new Promise((ok,bad)=>{let r=st(n).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)})}function put(n,v){return new Promise((ok,bad)=>{let r=st(n,'readwrite').put(v);r.onsuccess=()=>ok(v);r.onerror=()=>bad(r.error)})}function all(n){return new Promise((ok,bad)=>{let r=st(n).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)})}async function load(){game=await get('game','current')||null;events=await all('events')}async function saveGame(){if(game)await put('game',{...game,id:'current'})}async function saveEvent(e){await put('events',e);let i=events.findIndex(x=>x.id===e.id);if(i>=0)events[i]=e;else events.push(e)}
function mine(){return game?events.filter(e=>e.gameCode===game.gameCode&&!e.voided):[]}function unsynced(){return events.filter(e=>!e.synced)}function score(){let u=0,o=0;mine().forEach(e=>{if(e.type==='GOAL')u++;if(e.type==='OPP_GOAL')o++});return{u,o}}function gs(j){let e=mine().filter(x=>x.goalieJersey===j),s=e.filter(x=>x.type==='SAVE').length,ga=e.filter(x=>x.type==='OPP_GOAL').length,sh=s+ga;return{s,ga,sh,p:sh?s/sh:0}}
function status(){let on=navigator.onLine;document.getElementById('dot').className='dot '+(on?'on':'off');document.getElementById('net').textContent=syncing?'Syncing…':on?'Online':'Offline — scoring works';document.getElementById('q').textContent=unsynced().length+' waiting'}function haptic(ms=25){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}

function recordClock(v){let d=new Date(v);if(Number.isNaN(d.getTime()))return'';return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
function eventIcon(e){if(e.type==='GOAL')return'🚨';if(e.type==='OPP_GOAL')return'❌';if(e.type==='SAVE')return'🛑';if(e.type==='PENALTY')return'🟥';if(e.type==='GOALIE_CHANGE')return'🥅';if(e.type==='PERIOD_CHANGE')return'⏱';return'•'}
function eventTitle(e){if(e.type==='GOAL'){let a=[e.assist1Name,e.assist2Name].filter(Boolean);return `#${e.scorerJersey} ${e.scorerName}${a.length?' · A: '+a.join(', '):''}`}if(e.type==='OPP_GOAL')return `${game?.opponent||'Opponent'} goal${e.goalieName?' · '+e.goalieName+' in net':''}`;if(e.type==='SAVE')return `${e.goalieName||'Goalie'} save`;if(e.type==='PENALTY')return `#${e.penaltyPlayerJersey} ${e.penaltyPlayerName} · ${e.penaltyType} · ${formatPenaltyMinutes(e.penaltyMinutes)}`;if(e.type==='GOALIE_CHANGE')return `Goalie: #${e.goalieJersey} ${e.goalieName}`;if(e.type==='PERIOD_CHANGE')return `Period changed to ${e.period}`;return e.type}
function timelineHtml(list){let usable=(list||[]).filter(e=>!e.voided&&e.type!=='GAME_FINISH'),groups={};usable.forEach(e=>{let p=Number(e.period||0)||1;(groups[p]||(groups[p]=[])).push(e)});let periods=Object.keys(groups).map(Number).sort((a,b)=>a-b);if(!periods.length)return'<div class="sub">No events yet.</div>';return periods.map(p=>`<div class="periodBlock"><div class="periodHead">PERIOD ${p}</div>${groups[p].sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt))).map(e=>`<div class="timelineEvent"><div class="timelineIcon">${eventIcon(e)}</div><div class="timelineMain"><b>${esc(eventTitle(e))}</b><div class="timelineTime">Recorded ${esc(recordClock(e.createdAt))} · ${esc(e.coach||'')}</div></div><span class="pill">${e.synced===false?'local':'synced'}</span></div>`).join('')}</div>`).join('')}
function undoCandidate(){let nowMs=Date.now(),eligible=['GOAL','OPP_GOAL','SAVE','PENALTY'];return mine().slice().reverse().find(e=>eligible.includes(e.type)&&nowMs-new Date(e.createdAt).getTime()<=10000)}
async function undoLastEvent(){let e=undoCandidate();if(!e)return toast('Undo window expired');e.voided=true;await saveEvent(e);if(e.synced&&navigator.onLine&&ready()){try{let r=await jsonp({action:'voidEvent',eventId:e.id,gameCode:e.gameCode});if(!r.ok)throw new Error(r.error||'Undo sync failed')}catch(err){e.synced=false;await saveEvent(e)}}haptic(35);toast('Last event undone');live();sync()}

function live(){let s=score(),g=game.activeGoalieJersey?gs(game.activeGoalieJersey):null,u=undoCandidate(),state=syncing?'SYNCING':navigator.onLine?'LIVE':'OFFLINE',cls=syncing?'syncing':navigator.onLine?'online':'offline';document.getElementById('app').innerHTML=`<div class="liveStatus"><div><div class="liveBadge ${cls}">${state}</div><div class="sub">Code ${esc(game.gameCode)} · ${esc(coach())}</div></div><div style="text-align:right"><b>${unsynced().length} waiting</b><div class="sub">${navigator.onLine?'Cloud sync active':'Saved on phone'}</div></div></div><div class="card"><div style="text-align:center"><span class="pill">PERIOD ${game.period}</span></div><div class="score"><div><div class="team">LOCK MONSTERS</div><div class="num">${s.u}</div></div><div>VS</div><div><div class="team">${esc(game.opponent).toUpperCase()}</div><div class="num">${s.o}</div></div></div><div class="sub" style="text-align:center">Goalie: ${game.activeGoalieName?`#${game.activeGoalieJersey} ${esc(game.activeGoalieName)} · ${g.s}/${g.sh} · ${(g.p*100).toFixed(1)}%`:'Not selected'}</div></div><div class="card actions benchActions"><button onclick="goalStart()">🚨 Goal</button><button class="danger" onclick="oppGoal()">❌ Opp Goal</button><button class="secondary" onclick="save()">🛑 Save</button><button class="light" onclick="goalie()">🥅 Goalie</button><button class="secondary" onclick="period()">⏱ Period</button><button class="danger" onclick="penaltyStart()">🟥 Penalty</button><button class="light" onclick="sync()">↻ Sync</button><button class="light" onclick="home()">⌂ HQ</button></div>${u?`<div class="card undoBar"><div style="flex:1"><b>Last event can be undone</b><div class="sub">${esc(eventTitle(u))}</div></div><button class="warning" onclick="undoLastEvent()">↩ Undo</button></div>`:''}<div class="card"><h2>Team Timeline</h2>${timelineHtml(mine())}</div><button class="full danger" onclick="finish()">Finish Game</button>`}function ev(e){let t=e.type;if(e.type==='GOAL')t=`GOAL — #${e.s function formatPenaltyMinutes(m){m=Number(m||0);return m===1.5?'1:30':m===1?'1:00':m===2?'2:00':String(m)}function penaltyStart(){draft={};pick('Player receiving penalty?',[],false,j=>{let p=SK.find(x=>x.jersey===j);draft.penaltyPlayerJersey=p.jersey;draft.penaltyPlayerName=p.name;penaltyTypePick()})}function penaltyTypePick(){document.getElementById('app').innerHTML=`<div class="card"><h2>Penalty Type</h2><div class="players">${PENALTIES.map((p,i)=>`<button onclick="penaltyTypeChosen(${i})">${esc(p)}</button>`).join('')}</div><button class="full secondary" style="margin-top:10px" onclick="live()">Cancel</button></div>`}function penaltyTypeChosen(i){draft.penaltyType=PENALTIES[i];document.getElementById('app').innerHTML=`<div class="card"><h2>Penalty Length</h2><div class="players">${PENALTY_MINUTES.map(m=>`<button onclick="penaltyMinutesChosen(${m})">${formatPenaltyMinutes(m)}</button>`).join('')}</div><button class="full secondary" style="margin-top:10px" onclick="live()">Cancel</button></div>`}async function penaltyMinutesChosen(m){draft.penaltyMinutes=Number(m);await add({type:'PENALTY',penaltyPlayerJersey:draft.penaltyPlayerJersey,penaltyPlayerName:draft.penaltyPlayerName,penaltyType:draft.penaltyType,penaltyMinutes:draft.penaltyMinutes})}function goalStart(){draft={};pick('Who scored?',[],false,j=>{draft.scorerJersey=j;pick('Primary assist',[j],true,a=>{draft.assist1Jersey=a;pick('Secondary assist',[j,a].filter(Boolean),true,goalSave)})})}function pick(title,ex,none,cb){document.getElementById('app').innerHTML=`<div class="card"><h2>${title}</h2>${none?`<button class="full light" onclick="window.pickCb('')">None</button>`:''}<div class="players">${SK.filter(p=>!ex.includes(p.jersey)).map(p=>`<button onclick="pickCb('${p.jersey}')"><b>#${p.jersey}</b> ${esc(p.name.split(' ').pop())}</button>`).join('')}</div></div>`;window.pickCb=cb}async function goalSave(a2){draft.assist2Jersey=a2;let s=SK.find(p=>p.jersey===draft.scorerJersey),a1=SK.find(p=>p.jersey===draft.assist1Jersey),a=SK.find(p=>p.jersey===a2);await add({type:'GOAL',scorerJersey:s.jersey,scorerName:s.name,assist1Jersey:a1?.jersey||'',assist1Name:a1?.name||'',assist2Jersey:a?.jersey||'',assist2Name:a?.name||''})}function goalie(){document.getElementById('app').innerHTML=`<div class="card"><h2>Select Active Goalie</h2><div class="players">${GK.map(g=>`<button onclick="setGoalie('${g.jersey}')"><b>#${g.jersey}</b> ${esc(g.name)}</button>`).join('')}</div></div>`}async function setGoalie(j){let g=GK.find(x=>x.jersey===j);game.activeGoalieJersey=j;game.activeGoalieName=g.name;await saveGame();await add({type:'GOALIE_CHANGE',goalieJersey:j,goalieName:g.name})}async function save(){if(!game.activeGoalieJersey)return alert('Select goalie first');await add({type:'SAVE',goalieJersey:game.activeGoalieJersey,goalieName:game.activeGoalieName})}async function oppGoal(){await add({type:'OPP_GOAL',goalieJersey:game.activeGoalieJersey||'',goalieName:game.activeGoalieName||''})}async function period(){let p=Number(prompt('Period 1-5',game.period));if(![1,2,3,4,5].includes(p))return;game.period=p;await saveGame();await add({type:'PERIOD_CHANGE',period:p})}async function add(x){let t=Date.now();if(window.__lastAddAt&&t-window.__lastAddAt<450)return;window.__lastAddAt=t;let e={id:uid(),gameId:game.gameId,gameCode:game.gameCode,createdAt:now(),coach:coach(),deviceId:dev(),period:x.period||game.period,synced:false,voided:false,...x};await saveEvent(e);haptic(25);let msg=x.type==='GOAL'?'Goal recorded':x.type==='OPP_GOAL'?'Opponent goal recorded':x.type==='SAVE'?'Save recorded':x.type==='PENALTY'?'Penalty recorded':x.type==='GOALIE_CHANGE'?'Goalie updated':x.type==='PERIOD_CHANGE'?'Period updated':'Event recorded';toast(msg+' ✓');render();sync()}async function finish(){if(!confirm('Finish game?'))return;clearStatsCache();game.status='FINAL';await saveGame();await add({type:'GAME_FINISH'});home()}
async function push(e){let d=await jsonp({action:'push',payload:JSON.stringify(e)});if(d.ok){e.synced=true;await saveEvent(e)}}async function pull(){if(!game||!navigator.onLine)return;let d=await jsonp({action:'pull',gameCode:game.gameCode});if(!d.ok)return;if(d.game){game.status=d.game.status;game.period=d.game.period;game.activeGoalieJersey=d.game.activeGoalieJersey||game.activeGoalieJersey;game.activeGoalieName=d.game.activeGoalieName||game.activeGoalieName;await saveGame()}for(let r of d.events||[])if(!events.some(e=>e.id===r.id)){r.synced=true;await saveEvent(r)}}async function sync(){if(syncing||!navigator.onLine||!ready())return;syncing=true;status();try{for(let e of unsynced().slice())await push(e);await pull()}finally{syncing=false;status();if(game?.status==='LIVE'&&document.querySelector('#app .score'))live()}}

async function postgameReport(c){loading('Building Postgame Report');let r=await jsonp({action:'postgameReport',gameCode:c});if(!r.ok){alert(r.error||'Could not build report');return}window.__report=r;let prompt=buildChatGPTPrompt(r),box=buildBoxScore(r),social=buildSocialData(r);window.__prompt=prompt;window.__box=box;window.__social=social;document.getElementById('app').innerHTML=`<div class="card"><img class="reportLogo" src="lock-monsters-logo.png" alt="Lock Monsters logo"><h2>📰 Postgame Report</h2><div class="reportMeta"><div><span class="sub">Final</span><b>${r.game.teamGoals}-${r.game.oppGoals}</b></div><div><span class="sub">Record</span><b>${esc(r.season.record)}</b></div></div><div class="sub" style="margin-top:10px">This prompt contains the verified game data and writing instructions. Copy it into ChatGPT to generate the full story.</div></div><div class="card"><h2>ChatGPT Recap Prompt</h2><div class="reportText">${esc(prompt)}</div><button class="full" style="margin-top:10px" onclick="copyText(window.__prompt,'ChatGPT recap prompt')">Copy ChatGPT Prompt</button></div><div class="card"><h2>Quick Copy</h2><div class="copyGrid"><button class="light" onclick="copyText(window.__box,'Box score')">Copy Box Score</button><button class="light" onclick="copyText(window.__social,'Social summary data')">Copy Social Data</button></div></div><button class="full secondary" onclick="summary('${c}')">Back to Box Score</button>`}

function showPlayerCard(i){let p=window.__players[i];let last=p.last5||[];document.getElementById('app').innerHTML=`<div class="playerCard watermarkCard"><div class="playerHead"><div><div class="sub">LOCK MONSTERS PLAYER</div><div style="font-size:22px;font-weight:900">${esc(p.name)}</div></div><div class="jerseyBig">#${p.jersey}</div></div><div class="statGrid"><div class="statBox"><b>${p.gamesPlayed}</b><span>GP</span></div><div class="statBox"><b>${p.goals}</b><span>Goals</span></div><div class="statBox"><b>${p.assists}</b><span>Assists</span></div><div class="statBox"><b>${p.points}</b><span>Points</span></div><div class="statBox"><b>${Number(p.pim||0).toFixed((p.pim||0)%1?1:0)}</b><span>PIM</span></div><div class="statBox"><b>${p.ppg.toFixed(2)}</b><span>PPG</span></div></div></div><div class="card"><h2>Last 5 Games</h2>${last.length?last.map(g=>`<div class="row"><span>${esc(easternGameLabel(g.date,g.gameTime))} - "${esc(g.opponent)}"</span><b>${g.goals}G ${g.assists}A ${g.points}P</b></div>`).join(''):'<div class="sub">No completed games yet.</div>'}</div><div class="card"><h2>Season Notes</h2><div class="row"><span>Best points game</span><b>${p.bestGamePoints} P</b></div><div class="row"><span>Penalty count</span><b>${p.penalties}</b></div></div><button class="full secondary" data-route="players">Back</button>`}
async function threeStarsMenu(){if(!navigator.onLine){alert('Three Stars need a connection.');return}let d=await jsonp({action:'listGames'});if(!d.ok){alert(d.error||'Could not load games');return}document.getElementById('app').innerHTML=`<div class="card"><h2>Three Stars</h2>${d.games.length?d.games.map(g=>`<button class="playerListBtn" onclick="threeStars('${g.gameCode}')">${esc(easternGameLabel(g.date,g.gameTime))} - "${esc(g.opponent)}" <span style="float:right">${g.teamGoals}-${g.oppGoals}</span></button>`).join(''):'<div class="sub">No completed games yet.</div>'}</div><button class="full secondary" onclick="home()">Back</button>`}

async function seasonAwards(){if(!navigator.onLine){alert('Season Awards need a connection.');return}let d=await jsonp({action:'seasonAwards'});if(!d.ok){alert(d.error||'Could not load awards');return}document.getElementById('app').innerHTML=`<div class="card"><img class="starLogo" src="lock-monsters-logo.png" alt="Lock Monsters logo"><h2>Season Awards</h2>${d.awards.map(a=>`<div class="awardCard"><div class="awardTitle">${esc(a.title)}</div><div class="awardWinner">#${a.jersey} ${esc(a.name)}</div><div class="awardReason">${esc(a.reason)}</div></div>`).join('')}</div><div class="card"><div class="sub">These awards are based only on recorded statistics. Subjective awards such as leadership or effort are intentionally left to the coaching staff.</div></div><button class="full secondary" onclick="home()">Back</button>`}

document.addEventListener('click',function(ev){
  const el=ev.target.closest('[data-route]');
  if(!el)return;
  ev.preventDefault();
  const route=el.getAttribute('data-route');
  let action;
  try{
    if(route==='live-game')action=gameMenu();
    else if(route==='season')action=season();
    else if(route==='players')action=playerCards();
    else if(route==='stars')action=threeStarsMenu();
    else if(route==='awards')action=seasonAwards();
    else if(route==='archives')action=archives();
    Promise.resolve(action).catch(err=>{
      console.error('Navigation async error',route,err);
      alert('Navigation error: '+(err&&err.message?err.message:String(err)));
    });
  }catch(err){
    console.error('Navigation error',route,err);
    alert('Navigation error: '+(err&&err.message?err.message:String(err)));
  }
});
