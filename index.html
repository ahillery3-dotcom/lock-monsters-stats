<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#041E42">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Lock Monsters Stats</title>
  <style>
    :root{--navy:#041E42;--blue:#004C97;--red:#AC162C;--bg:#eef3f9;--text:#0c1b2e;--muted:#64748b;--green:#18864b;--amber:#c58a00}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);overscroll-behavior:none}
    header{background:linear-gradient(135deg,var(--navy),var(--blue));color:white;padding:14px 16px;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.15)}
    .eyebrow{font-size:10px;letter-spacing:.28em;font-weight:800}.title{font-size:22px;font-weight:900;margin:3px 0}.motto{font-size:11px}
    main{max-width:680px;margin:auto;padding:10px 10px calc(28px + env(safe-area-inset-bottom))}
    .card{background:#fff;border-radius:18px;padding:13px;margin-bottom:9px;box-shadow:0 3px 12px rgba(4,30,66,.07)}
    h2{font-size:17px;margin:0 0 10px}.sub{font-size:12px;color:var(--muted);margin-top:3px}
    label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:6px 0}
    input,select{width:100%;font-size:16px;padding:13px;border:1px solid #d7e0ea;border-radius:13px;background:#fff;margin-bottom:8px}
    button{border:0;border-radius:16px;background:var(--blue);color:white;min-height:54px;padding:12px;font-size:16px;font-weight:900;touch-action:manipulation}
    button:active{transform:scale(.985)}
    .full{width:100%}.secondary{background:var(--navy)}.danger{background:var(--red)}.light{background:#e8f0fa;color:var(--navy)}.warning{background:#fff7e6;color:#8a5a00}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .bigAction{min-height:82px;font-size:21px}
    .players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.players button{background:#edf4fb;color:var(--navy);text-align:left;min-height:58px}.players b{color:var(--blue)}
    .scoreWrap{text-align:center}.period{display:inline-block;background:#e7f0fb;color:var(--blue);font-weight:900;font-size:12px;border-radius:999px;padding:6px 9px;margin-bottom:6px}
    .score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center}.num{font-size:56px;font-weight:900;line-height:1}.team{font-size:12px;font-weight:900}.vs{color:#8E9090;font-weight:900}
    .code{font-size:24px;font-weight:900;letter-spacing:.16em;text-align:center;padding-top:7px;color:var(--navy)}
    .event{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #edf1f5;padding:9px 0}.event:first-child{border-top:0}.eventTitle{font-weight:900;font-size:14px}
    .statusRow{display:flex;justify-content:space-between;gap:8px;align-items:center}.status{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:900}
    .dot{width:9px;height:9px;border-radius:50%}.online{background:var(--green)}.offline{background:var(--red)}.syncing{background:var(--amber)}
    .pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#e7f0fb;color:var(--blue);font-size:11px;font-weight:900}
    .banner{display:none;padding:10px 12px;border-radius:12px;margin-bottom:9px;font-size:12px;font-weight:800}.banner.show{display:block}
    .error{background:#fff1f2;color:#881337;border:1px solid #fecdd3}.ok{background:#ecfdf5;color:#166534;border:1px solid #bbf7d0}
    .diag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;white-space:pre-wrap;background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:10px;max-height:220px;overflow:auto}
    .toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.toolbar button{min-height:45px;font-size:13px}
    @media(max-width:390px){.players{grid-template-columns:1fr}.num{font-size:50px}.bigAction{min-height:76px}}
  </style>
</head>
<body>
<header>
  <div class="eyebrow">LOCKPORT</div>
  <div class="title">LOCK MONSTERS</div>
  <div class="motto">One Team. One Standard. No Excuses.</div>
</header>
<main>
  <div id="banner" class="banner"></div>
  <div class="card">
    <div class="statusRow">
      <div class="status"><span id="statusDot" class="dot"></span><span id="statusText"></span></div>
      <span class="pill" id="queueText">0 waiting</span>
    </div>
    <div class="sub" id="syncText"></div>
  </div>
  <div id="app"></div>
</main>

<script>
const APP_VERSION='1.0.0-rc1';
const ROSTER=[
['71','Jonathan Clark'],['11','Mark Corrao'],['8','Anson Czosek'],['88','Mason Dziura'],
['97','Benjamin Ewart'],['14','Elliott Granville'],['23','Ryan Hillery'],['4','Brandyn Johnston'],
['91','Alex Jordan'],['54','Noah Kennedy'],['29','Caden Mooradian'],['47','Blake Plewinski'],
['41','Jack Sheehan'],['89','Callen Young'],['26','Maxwell Zhang']
].map(([jersey,name])=>({jersey,name}));

/* PASTE YOUR DEPLOYED APPS SCRIPT /exec URL HERE */
const SYNC_ENDPOINT='https://script.google.com/macros/s/AKfycbweFj24alET9wn1tKkhADoy_JROQapukEAKJ2MxKCQm3oUt2RGj1z837xu_9M1SEFvP/exec';

const DB_NAME='lockmonsters-pwa-v4',DB_VERSION=1;
const HEARTBEAT_MS=15000;
const RETRY_MIN_MS=2500;
const RETRY_MAX_MS=60000;

let db,game=null,events=[],draft={},syncing=false,retryMs=RETRY_MIN_MS,retryTimer=null,heartbeatTimer=null;
let diagnostics=[];

function logDiag(msg,extra=''){
  const line=`${new Date().toISOString()}  ${msg}${extra?'  '+extra:''}`;
  diagnostics.push(line);
  if(diagnostics.length>120)diagnostics=diagnostics.slice(-120);
  localStorage.setItem('lm_diag',JSON.stringify(diagnostics));
}
function loadDiag(){try{diagnostics=JSON.parse(localStorage.getItem('lm_diag')||'[]')}catch{diagnostics=[]}}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function lastName(n){return String(n).split(' ').pop()}
function nowIso(){return new Date().toISOString()}
function today(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}
function endpointReady(){return SYNC_ENDPOINT.startsWith('https://script.google.com/macros/s/')&&SYNC_ENDPOINT.endsWith('/exec')}
function coach(){return localStorage.getItem('coach')||'Coach'}
function deviceId(){let d=localStorage.getItem('lm_device');if(!d){d=uid();localStorage.setItem('lm_device',d)}return d}

function openDB(){return new Promise((ok,bad)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('game'))d.createObjectStore('game',{keyPath:'id'});if(!d.objectStoreNames.contains('events'))d.createObjectStore('events',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>bad(r.error)})}
function store(n,m='readonly'){return db.transaction(n,m).objectStore(n)}
function idbGet(n,k){return new Promise((ok,bad)=>{const r=store(n).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)})}
function idbPut(n,v){return new Promise((ok,bad)=>{const r=store(n,'readwrite').put(v);r.onsuccess=()=>ok(v);r.onerror=()=>bad(r.error)})}
function idbAll(n){return new Promise((ok,bad)=>{const r=store(n).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)})}

async function loadLocal(){
  game=await idbGet('game','current')||null;
  events=(await idbAll('events')).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
  logDiag('Loaded local state',`events=${events.length} game=${game?.status||'NONE'}`);
}
async function saveGame(){if(game)await idbPut('game',{...game,id:'current'})}
async function saveEvent(e){
  await idbPut('events',e);
  const i=events.findIndex(x=>x.id===e.id);
  if(i>=0)events[i]=e;else events.push(e);
  events.sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
}
async function mergeRemote(remote){
  let added=0,updated=0;
  for(const r of remote||[]){
    const i=events.findIndex(e=>e.id===r.id);
    if(i<0){r.synced=true;await saveEvent(r);added++}
    else{
      const local=events[i];
      let changed=false;
      if(r.voided&&!local.voided){local.voided=true;changed=true}
      if(!local.synced){local.synced=true;changed=true}
      if(changed){await saveEvent(local);updated++}
    }
  }
  if(added||updated)logDiag('Merged remote',`added=${added} updated=${updated}`);
}
function myEvents(){return game?events.filter(e=>e.gameCode===game.gameCode):[]}
function activeEvents(){return myEvents().filter(e=>!e.voided)}
function unsynced(){return events.filter(e=>!e.synced)}
function score(){let us=0,them=0;activeEvents().forEach(e=>{if(e.type==='GOAL')us++;if(e.type==='OPP_GOAL')them++});return{us,them}}

function render(){updateStatus();game?.status==='LIVE'?renderLive():renderHome()}
function renderHome(){
  document.getElementById('app').innerHTML=`
  <div class="card"><h2>Create Game</h2>
  <label>Opponent</label><input id="opp" placeholder="Opponent">
  <label>Date</label><input id="date" type="date" value="${today()}">
  <label>Coach</label><input id="coach" placeholder="Coach name" value="${esc(localStorage.getItem('coach')||'')}">
  <button class="full" onclick="createGame()">Create Game Code</button></div>
  <div class="card"><h2>Join Existing Game</h2>
  <label>Game Code</label><input id="joinCode" maxlength="6" placeholder="ABC123" style="text-transform:uppercase">
  <label>Coach</label><input id="joinCoach" placeholder="Coach name" value="${esc(localStorage.getItem('coach')||'')}">
  <button class="full secondary" onclick="joinGame()">Join Game</button></div>
  <div class="card"><div class="toolbar">
    <button class="light" onclick="showDiagnostics()">Diagnostics</button>
    <button class="light" onclick="forceSync()">Force Sync</button>
    <button class="light" onclick="reloadApp()">Reload</button>
  </div><div class="sub" style="margin-top:8px">PWA ${APP_VERSION}</div></div>`
}
async function createGame(){
  const opp=document.getElementById('opp').value.trim(),date=document.getElementById('date').value,c=document.getElementById('coach').value.trim();
  if(!opp||!date||!c){showBanner('Enter opponent, date, and coach.','error');return}
  localStorage.setItem('coach',c);
  if(!navigator.onLine||!endpointReady()){showBanner('Creating a shared game requires a connection once.','error');return}
  try{
    const data=await jsonp({action:'createGame',opponent:opp,date,coach:c,deviceId:deviceId()});
    if(!data.ok)throw new Error(data.error||'Could not create game');
    game={id:'current',gameId:data.gameId,gameCode:data.gameCode,status:'LIVE',opponent:data.opponent,date:data.date,period:data.period||1,createdAt:nowIso()};
    await saveGame();logDiag('Game created',data.gameCode);render();showBanner('Game created. Share code '+data.gameCode,'ok');await pullRemote()
  }catch(e){logDiag('Create game failed',e.message);showBanner(e.message,'error')}
}
async function joinGame(){
  const code=document.getElementById('joinCode').value.trim().toUpperCase(),c=document.getElementById('joinCoach').value.trim();
  if(!code||!c){showBanner('Enter game code and coach.','error');return}
  localStorage.setItem('coach',c);
  if(!navigator.onLine||!endpointReady()){showBanner('Joining a shared game requires a connection once.','error');return}
  try{
    const data=await jsonp({action:'joinGame',gameCode:code,coach:c,deviceId:deviceId()});
    if(!data.ok)throw new Error(data.error||'Could not join game');
    game={id:'current',gameId:data.gameId,gameCode:data.gameCode,status:data.status,opponent:data.opponent,date:data.date,period:data.period||1,createdAt:nowIso()};
    await saveGame();await pullRemote();logDiag('Joined game',code);render()
  }catch(e){logDiag('Join failed',e.message);showBanner(e.message,'error')}
}
function renderLive(){
  const s=score(),ev=activeEvents().slice().reverse().slice(0,30);
  document.getElementById('app').innerHTML=`
  <div class="card scoreWrap">
    <span class="period">PERIOD ${game.period}</span>
    <div class="score"><div><div class="team">LOCK MONSTERS</div><div class="num">${s.us}</div></div><div class="vs">VS</div><div><div class="team">${esc(game.opponent).toUpperCase()}</div><div class="num">${s.them}</div></div></div>
    <div class="code">${esc(game.gameCode)}</div>
  </div>
  <div class="card"><div class="actions">
    <button class="bigAction" onclick="goalStart()">🥅<br>GOAL</button>
    <button class="bigAction danger" onclick="oppGoal()">❌<br>OPP GOAL</button>
    <button class="secondary" onclick="changePeriod()">⏱ PERIOD</button>
    <button class="light" onclick="forceSync()">↻ SYNC</button>
  </div></div>
  <div class="card"><h2>Game Timeline</h2>${ev.length?ev.map(eventHtml).join(''):'<div class="sub">No events yet.</div>'}</div>
  <div class="card"><div class="toolbar">
    <button class="light" onclick="showDiagnostics()">Diagnostics</button>
    <button class="danger" onclick="finishGame()">Finish</button>
    <button class="warning" onclick="leaveGame()">Leave View</button>
  </div></div>`
}
function eventHtml(e){
  let title=e.type;
  if(e.type==='GOAL')title=`GOAL — #${e.scorerJersey} ${esc(e.scorerName)}`;
  if(e.type==='OPP_GOAL')title='OPP GOAL';
  if(e.type==='PERIOD_CHANGE')title=`PERIOD → ${e.period}`;
  const assists=[e.assist1Name,e.assist2Name].filter(Boolean),canUndo=['GOAL','OPP_GOAL'].includes(e.type);
  return `<div class="event"><div><div class="eventTitle">${title}</div><div class="sub">P${e.period||'-'} · ${new Date(e.createdAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})} · ${esc(e.coach)}${assists.length?' · A: '+assists.map(esc).join(', '):''}</div></div><div>${canUndo?`<button class="light" style="min-height:32px;padding:5px 8px;font-size:11px" onclick="undoEvent('${e.id}')">Undo</button>`:`<span class="pill">${e.synced?'synced':'local'}</span>`}</div></div>`
}
function goalStart(){draft={};pick('Who scored?',[],false,j=>{draft.scorerJersey=j;pick('Primary assist',[j],true,a=>{draft.assist1Jersey=a;pick('Secondary assist',[j,a].filter(Boolean),true,saveGoal)})})}
function pick(title,excluded,none,cb){
  document.getElementById('app').innerHTML=`<div class="card"><h2>${title}</h2>${none?`<button class="full light" style="margin-bottom:8px" onclick="window.pickCb('')">None</button>`:''}<div class="players">${ROSTER.filter(p=>!excluded.includes(p.jersey)).map(p=>`<button onclick="window.pickCb('${p.jersey}')"><b>#${p.jersey}</b> ${esc(lastName(p.name))}</button>`).join('')}</div><button class="full secondary" style="margin-top:10px" onclick="renderLive()">Cancel</button></div>`;
  window.pickCb=cb
}
async function saveGoal(a2){
  draft.assist2Jersey=a2;
  const scorer=ROSTER.find(p=>p.jersey===draft.scorerJersey),a1=ROSTER.find(p=>p.jersey===draft.assist1Jersey),a2p=ROSTER.find(p=>p.jersey===draft.assist2Jersey);
  const e={id:uid(),gameId:game.gameId,gameCode:game.gameCode,type:'GOAL',createdAt:nowIso(),coach:coach(),deviceId:deviceId(),period:game.period,scorerJersey:scorer.jersey,scorerName:scorer.name,assist1Jersey:a1?.jersey||'',assist1Name:a1?.name||'',assist2Jersey:a2p?.jersey||'',assist2Name:a2p?.name||'',synced:false,voided:false,retryCount:0};
  await saveEvent(e);logDiag('Goal saved locally',e.id);render();scheduleSync(50)
}
async function oppGoal(){
  const e={id:uid(),gameId:game.gameId,gameCode:game.gameCode,type:'OPP_GOAL',createdAt:nowIso(),coach:coach(),deviceId:deviceId(),period:game.period,synced:false,voided:false,retryCount:0};
  await saveEvent(e);logDiag('Opponent goal saved locally',e.id);render();scheduleSync(50)
}
async function changePeriod(){
  const p=Number(prompt('Period 1-5:',String(game.period)));if(![1,2,3,4,5].includes(p))return;
  game.period=p;await saveGame();
  const e={id:uid(),gameId:game.gameId,gameCode:game.gameCode,type:'PERIOD_CHANGE',createdAt:nowIso(),coach:coach(),deviceId:deviceId(),period:p,synced:false,voided:false,retryCount:0};
  await saveEvent(e);logDiag('Period changed',String(p));render();scheduleSync(50)
}
async function undoEvent(id){
  const target=events.find(e=>e.id===id);if(!target||!confirm('Undo this event?'))return;
  target.voided=true;target.synced=false;target.voidedAt=nowIso();target.voidCoach=coach();target.retryCount=0;
  await saveEvent(target);logDiag('Event voided locally',id);render();scheduleSync(50)
}
async function finishGame(){
  if(!confirm('Finish this game for all coaches?'))return;
  game.status='FINAL';await saveGame();
  const e={id:uid(),gameId:game.gameId,gameCode:game.gameCode,type:'GAME_FINISH',createdAt:nowIso(),coach:coach(),deviceId:deviceId(),period:game.period,synced:false,voided:false,retryCount:0};
  await saveEvent(e);logDiag('Game finished locally',game.gameCode);render();scheduleSync(50)
}
async function leaveGame(){game=null;await idbPut('game',{id:'current',status:'NONE'});render()}

function updateStatus(){
  const online=navigator.onLine,dot=document.getElementById('statusDot'),txt=document.getElementById('statusText');
  dot.className='dot '+(syncing?'syncing':online?'online':'offline');
  txt.textContent=syncing?'Syncing…':online?'Online':'Offline — scoring still works';
  document.getElementById('queueText').textContent=`${unsynced().length} waiting`;
  document.getElementById('syncText').textContent=!endpointReady()?'Configure Apps Script endpoint to enable sync.':unsynced().length?'Saved on phone. Automatic retry is active.':'All events synced to Google Sheets.';
}
function showBanner(msg,type='ok'){const b=document.getElementById('banner');b.textContent=msg;b.className=`banner show ${type}`;setTimeout(()=>b.className='banner',3200)}

function jsonp(params,timeout=12000){
  return new Promise((resolve,reject)=>{
    if(!endpointReady()){reject(new Error('Sync endpoint is not configured.'));return}
    const cb='lmcb_'+Date.now()+'_'+Math.random().toString(16).slice(2),script=document.createElement('script');
    const timer=setTimeout(()=>cleanup(new Error('Sync timed out.')),timeout);
    function cleanup(err,data){clearTimeout(timer);delete window[cb];script.remove();err?reject(err):resolve(data)}
    window[cb]=data=>cleanup(null,data);params.callback=cb;
    script.onerror=()=>cleanup(new Error('Could not reach sync server.'));
    script.src=SYNC_ENDPOINT+'?'+new URLSearchParams(params).toString();
    document.body.appendChild(script)
  })
}
async function pushOne(e){
  try{
    const data=await jsonp({action:'push',payload:JSON.stringify(e)});
    if(!data?.ok)throw new Error(data?.error||'Push failed');
    e.synced=true;e.syncedAt=nowIso();e.lastError='';await saveEvent(e);
    logDiag('Synced event',e.id)
  }catch(err){
    e.retryCount=(e.retryCount||0)+1;e.lastError=err.message;e.lastAttemptAt=nowIso();await saveEvent(e);
    logDiag('Sync event failed',`${e.id} ${err.message}`);
    throw err
  }
}
async function pullRemote(){
  if(!game||!endpointReady()||!navigator.onLine)return;
  const data=await jsonp({action:'pull',gameCode:game.gameCode});
  if(!data?.ok)throw new Error(data?.error||'Pull failed');
  if(data.game){
    game.status=data.game.status||game.status;
    game.period=Number(data.game.period||game.period);
    game.opponent=data.game.opponent||game.opponent;await saveGame()
  }
  await mergeRemote(data.events||[])
}
function scheduleSync(delay=retryMs){
  clearTimeout(retryTimer);
  retryTimer=setTimeout(()=>trySync(),delay)
}
async function trySync(){
  if(syncing||!navigator.onLine||!endpointReady())return;
  syncing=true;updateStatus();
  try{
    for(const e of unsynced().slice()){await pushOne(e)}
    await pullRemote();
    retryMs=RETRY_MIN_MS;
  }catch(err){
    retryMs=Math.min(RETRY_MAX_MS,Math.max(RETRY_MIN_MS,retryMs*2));
    scheduleSync(retryMs);
    logDiag('Scheduled retry',`${retryMs}ms`);
  }finally{
    syncing=false;render()
  }
}
async function forceSync(){retryMs=RETRY_MIN_MS;await trySync()}
function startHeartbeat(){
  clearInterval(heartbeatTimer);
  heartbeatTimer=setInterval(()=>{if(navigator.onLine&&game?.status==='LIVE')trySync()},HEARTBEAT_MS)
}
function showDiagnostics(){
  document.getElementById('app').innerHTML=`<div class="card"><h2>Diagnostics</h2>
  <div class="sub">Device: ${esc(deviceId())}</div>
  <div class="sub">Version: ${APP_VERSION}</div>
  <div class="sub">Queued: ${unsynced().length}</div>
  <div class="diag">${esc(diagnostics.slice().reverse().join('\n'))}</div>
  <div class="actions" style="margin-top:10px"><button class="secondary" onclick="render()">Back</button><button class="light" onclick="clearDiagnostics()">Clear Log</button></div></div>`
}
function clearDiagnostics(){diagnostics=[];localStorage.removeItem('lm_diag');showDiagnostics()}
function reloadApp(){location.reload()}

window.addEventListener('online',()=>{logDiag('Network online');updateStatus();scheduleSync(100)});
window.addEventListener('offline',()=>{logDiag('Network offline');updateStatus()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){logDiag('App foregrounded');scheduleSync(200)}});

(async()=>{
  loadDiag();await openDB();await loadLocal();
  if('serviceWorker'in navigator){try{await navigator.serviceWorker.register('./sw.js')}catch(e){logDiag('Service worker error',e.message)}}
  render();startHeartbeat();scheduleSync(500)
})();
</script>
</body>
</html>
