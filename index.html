<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#041E42"><link rel="manifest" href="manifest.webmanifest"><title>Lock Monsters Stats</title><style>
:root{--n:#041E42;--b:#004C97;--r:#AC162C;--bg:#f3f6fa;--m:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;color:#0c1b2e}header{background:linear-gradient(135deg,var(--n),var(--b));color:#fff;padding:16px 18px;position:sticky;top:0}.ey{font-size:10px;letter-spacing:.3em;font-weight:800}.ti{font-size:23px;font-weight:900;margin:3px 0}.mo{font-size:11px}main{max-width:640px;margin:auto;padding:12px 10px 34px}.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 3px 14px #041e4214}h2{font-size:18px;margin:0 0 11px}.sub{font-size:12px;color:var(--m);margin-top:3px}label{display:block;font-size:12px;font-weight:800;color:var(--m);margin:6px 0}input{width:100%;font-size:16px;padding:13px;border:1px solid #d7e0ea;border-radius:13px;margin-bottom:9px}button{border:0;border-radius:14px;background:var(--b);color:#fff;min-height:50px;padding:12px;font-size:15px;font-weight:900}.full{width:100%}.sec{background:var(--n)}.danger{background:var(--r)}.light{background:#e8f0fa;color:var(--n)}.actions,.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.players button{background:#edf4fb;color:var(--n);text-align:left}.players b{color:var(--b)}.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center}.num{font-size:46px;font-weight:900}.team{font-size:12px;font-weight:900}.vs{color:#8E9090;font-weight:900}.code{font-size:28px;font-weight:900;letter-spacing:.18em;text-align:center;padding:8px 0}.event{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #edf1f5;padding:9px 0}.status{display:flex;justify-content:space-between;font-size:12px;font-weight:900}.pill{padding:5px 8px;border-radius:999px;background:#e7f0fb;color:var(--b);font-size:11px;font-weight:900}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.on{background:#18864b}.off{background:var(--r)}.sync{background:#c58a00}@media(max-width:380px){.players{grid-template-columns:1fr}}
</style></head><body><header><div class="ey">LOCKPORT</div><div class="ti">LOCK MONSTERS</div><div class="mo">One Team. One Standard. No Excuses.</div></header><main><div class="card"><div class="status"><span><span id="dot" class="dot"></span><span id="st"></span></span><span id="q" class="pill"></span></div><div id="syncText" class="sub"></div></div><div id="app"></div></main><script>
const V='0.3.0',ENDPOINT='https://script.google.com/macros/s/AKfycbweFj24alET9wn1tKkhADoy_JROQapukEAKJ2MxKCQm3oUt2RGj1z837xu_9M1SEFvP/exec';const R=[['71','Jonathan Clark'],['11','Mark Corrao'],['8','Anson Czosek'],['88','Mason Dziura'],['97','Benjamin Ewart'],['14','Elliott Granville'],['23','Ryan Hillery'],['4','Brandyn Johnston'],['91','Alex Jordan'],['54','Noah Kennedy'],['29','Caden Mooradian'],['47','Blake Plewinski'],['41','Jack Sheehan'],['89','Callen Young'],['26','Maxwell Zhang']].map(x=>({jersey:x[0],name:x[1]}));let db,game,events=[],draft={},syncing=false;
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2),now=()=>new Date().toISOString(),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),coach=()=>localStorage.getItem('coach')||'Coach',ready=()=>ENDPOINT.startsWith('https://script.google.com/macros/s/')&&ENDPOINT.endsWith('/exec');function dev(){let d=localStorage.getItem('lm_device');if(!d){d=uid();localStorage.setItem('lm_device',d)}return d}
function openDB(){return new Promise((o,b)=>{const r=indexedDB.open('lm-pwa-v3',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('game'))d.createObjectStore('game',{keyPath:'id'});if(!d.objectStoreNames.contains('events'))d.createObjectStore('events',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;o()};r.onerror=()=>b(r.error)})}function os(n,m='readonly'){return db.transaction(n,m).objectStore(n)}function get(n,k){return new Promise((o,b)=>{const r=os(n).get(k);r.onsuccess=()=>o(r.result);r.onerror=()=>b(r.error)})}function put(n,v){return new Promise((o,b)=>{const r=os(n,'readwrite').put(v);r.onsuccess=()=>o(v);r.onerror=()=>b(r.error)})}function all(n){return new Promise((o,b)=>{const r=os(n).getAll();r.onsuccess=()=>o(r.result);r.onerror=()=>b(r.error)})}
async function load(){game=await get('game','current')||null;events=await all('events');render()}async function saveGame(){if(game)await put('game',{...game,id:'current'})}async function saveEvent(e){await put('events',e);const i=events.findIndex(x=>x.id===e.id);i>=0?events[i]=e:events.push(e);events.sort((a,b)=>a.createdAt.localeCompare(b.createdAt))}function mine(){return game?events.filter(e=>e.gameCode===game.gameCode):[]}function active(){return mine().filter(e=>!e.voided)}function score(){let u=0,t=0;active().forEach(e=>{if(e.type==='GOAL')u++;if(e.type==='OPP_GOAL')t++});return{u,t}}function uns(){return events.filter(e=>!e.synced)}
function status(){document.getElementById('dot').className='dot '+(syncing?'sync':navigator.onLine?'on':'off');document.getElementById('st').textContent=syncing?'Syncing…':navigator.onLine?'Online':'Offline — scoring still works';document.getElementById('q').textContent=uns().length+' waiting';document.getElementById('syncText').textContent=!ready()?'Configure sync endpoint.':uns().length?'Saved on phone. Waiting to sync.':'All events synced to Google Sheets.'}
function render(){status();game?.status==='LIVE'?live():home()}function home(){document.getElementById('app').innerHTML=`<div class="card"><h2>Create Game</h2><label>Opponent</label><input id="opp"><label>Date</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"><label>Coach</label><input id="coach" value="${esc(localStorage.getItem('coach')||'')}"><button class="full" onclick="createGame()">Create Game Code</button></div><div class="card"><h2>Join Existing Game</h2><label>Game Code</label><input id="code" maxlength="6" style="text-transform:uppercase"><label>Coach</label><input id="joinCoach" value="${esc(localStorage.getItem('coach')||'')}"><button class="full sec" onclick="joinGame()">Join Game</button></div><div class="card"><span class="pill">PWA ${V}</span></div>`}
function jsonp(p){return new Promise((o,b)=>{if(!ready())return b(Error('Sync endpoint not configured'));const cb='cb'+Date.now()+Math.random().toString(16).slice(2),s=document.createElement('script'),timer=setTimeout(()=>done(Error('Sync timed out')),12000);function done(e,d){clearTimeout(timer);delete window[cb];s.remove();e?b(e):o(d)}window[cb]=d=>done(null,d);p.callback=cb;s.onerror=()=>done(Error('Could not reach sync server'));s.src=ENDPOINT+'?'+new URLSearchParams(p);document.body.appendChild(s)})}
async function createGame(){const opp=document.getElementById('opp').value.trim(),date=document.getElementById('date').value,c=document.getElementById('coach').value.trim();if(!opp||!date||!c)return alert('Enter opponent, date and coach');if(!navigator.onLine)return alert('Creating a shared game needs a connection once.');localStorage.setItem('coach',c);const r=await jsonp({action:'createGame',opponent:opp,date,coach:c});if(!r.ok)return alert(r.error);game={id:'current',...r.game,createdAt:now()};await saveGame();render()}
async function joinGame(){const code=document.getElementById('code').value.trim().toUpperCase(),c=document.getElementById('joinCoach').value.trim();if(!code||!c)return alert('Enter game code and coach');localStorage.setItem('coach',c);const r=await jsonp({action:'joinGame',gameCode:code});if(!r.ok)return alert(r.error);game={id:'current',...r.game,createdAt:now()};await saveGame();await pull();render()}
function live(){const s=score(),ev=active().slice().reverse();document.getElementById('app').innerHTML=`<div class="card" style="text-align:center"><span class="pill">PERIOD ${game.period}</span><div class="score"><div><div class="team">LOCK MONSTERS</div><div class="num">${s.u}</div></div><div class="vs">VS</div><div><div class="team">${esc(game.opponent).toUpperCase()}</div><div class="num">${s.t}</div></div></div><div class="code">${game.gameCode}</div><div class="sub">Share this code with other coaches</div></div><div class="card"><div class="actions"><button onclick="goal()">🥅 Goal</button><button class="danger" onclick="oppGoal()">❌ Opp Goal</button><button class="sec" onclick="period()">⏱ Period</button><button class="light" onclick="syncNow()">↻ Sync Now</button></div></div><div class="card"><h2>Recent Events</h2>${ev.length?ev.map(row).join(''):'<div class="sub">No events yet.</div>'}</div><button class="full danger" onclick="finish()">✓ Finish Game</button>`}
function row(e){let t=e.type==='GOAL'?`GOAL — #${e.scorerJersey} ${esc(e.scorerName)}`:e.type==='OPP_GOAL'?'OPP GOAL':e.type==='PERIOD_CHANGE'?`PERIOD → ${e.period}`:e.type;const a=[e.assist1Name,e.assist2Name].filter(Boolean),undo=['GOAL','OPP_GOAL'].includes(e.type);return `<div class="event"><div><strong>${t}</strong><div class="sub">${new Date(e.createdAt).toLocaleTimeString()} · ${esc(e.coach)}${a.length?' · A: '+a.join(', '):''}</div></div>${undo?`<button class="light" style="min-height:32px;padding:5px" onclick="undo('${e.id}')">Undo</button>`:`<span class="pill">${e.synced?'synced':'local'}</span>`}</div>`}
function pick(title,excluded,none,cb){document.getElementById('app').innerHTML=`<div class="card"><h2>${title}</h2>${none?`<button class="full light" onclick="window.pickCb('')">None</button>`:''}<div class="players">${R.filter(p=>!excluded.includes(p.jersey)).map(p=>`<button onclick="window.pickCb('${p.jersey}')"><b>#${p.jersey}</b> ${p.name.split(' ').pop()}</button>`).join('')}</div><button class="full sec" style="margin-top:10px" onclick="live()">Cancel</button></div>`;window.pickCb=cb}function goal(){draft={};pick('Who scored?',[],false,j=>{draft.scorerJersey=j;pick('Primary assist',[j],true,a=>{draft.assist1Jersey=a;pick('Secondary assist',[j,a].filter(Boolean),true,saveGoal)})})}
async function saveGoal(a2){draft.assist2Jersey=a2;const p=R.find(x=>x.jersey===draft.scorerJersey),a=R.find(x=>x.jersey===draft.assist1Jersey),b=R.find(x=>x.jersey===draft.assist2Jersey),e={id:uid(),gameId:game.gameId,gameCode:game.gameCode,type:'GOAL',createdAt:now(),coach:coach(),deviceId:dev(),period:game.period,scorerJersey:p.jersey,scorerName:p.name,assist1Jersey:a?.jersey||'',assist1Name:a?.name||'',assist2Jersey:b?.jersey||'',assist2Name:b?.name||'',synced:false,voided:false};await saveEvent(e);render();syncNow()}
async function oppGoal(){await saveEvent({id:uid(),gameId:game.gameId,gameCode:game.gameCode,type:'OPP_GOAL',createdAt:now(),coach:coach(),deviceId:dev(),period:game.period,synced:false,voided:false});render();syncNow()}async function period(){const p=Number(prompt('Period 1-5:',game.period));if(![1,2,3,4,5].includes(p))return;game.period=p;await saveGame();await saveEvent({id:uid(),gameId:game.gameId,gameCode:game.gameCode,type:'PERIOD_CHANGE',createdAt:now(),coach:coach(),deviceId:dev(),period:p,synced:false,voided:false});render();syncNow()}async function undo(id){const e=events.find(x=>x.id===id);if(!e||!confirm('Undo this event?'))return;e.voided=true;e.synced=false;e.voidCoach=coach();await saveEvent(e);render();syncNow()}async function finish(){if(!confirm('Finish this game for all coaches?'))return;await saveEvent({id:uid(),gameId:game.gameId,gameCode:game.gameCode,type:'GAME_FINISH',createdAt:now(),coach:coach(),deviceId:dev(),period:game.period,synced:false,voided:false});game.status='FINAL';await saveGame();render();syncNow()}
async function push(e){const r=await jsonp({action:'push',payload:JSON.stringify(e)});if(!r.ok)throw Error(r.error);e.synced=true;await saveEvent(e)}async function pull(){if(!game||!navigator.onLine)return;const r=await jsonp({action:'pull',gameCode:game.gameCode});if(!r.ok)throw Error(r.error);game={...game,...r.game};await saveGame();for(const x of r.events){const i=events.findIndex(e=>e.id===x.id);if(i<0)await saveEvent(x);else if(x.voided&&!events[i].voided){events[i].voided=true;events[i].synced=true;await saveEvent(events[i])}}}async function syncNow(){if(syncing||!navigator.onLine||!ready())return;syncing=true;status();try{for(const e of uns().slice())await push(e);await pull()}catch(e){console.warn(e)}finally{syncing=false;render()}}
window.addEventListener('online',syncNow);window.addEventListener('offline',status);(async()=>{await openDB();await load();if('serviceWorker'in navigator)try{await navigator.serviceWorker.register('./sw.js')}catch(e){}setTimeout(syncNow,500)})();
</script></body></html>
