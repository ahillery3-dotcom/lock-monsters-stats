async function showDiagnostics(){loading('Running System Check');let backendInfo=null,started=performance.now(),err='';try{backendInfo=await jsonp({action:'diagnostics'},30000,2)}catch(e){err=e&&e.message?e.message:String(e)}let elapsed=Math.round(performance.now()-started),pending=unsynced().length,avg=__perf.samples.length?Math.round(__perf.samples.reduce((n,x)=>n+x.ms,0)/__perf.samples.length):0,ok=!!(backendInfo&&backendInfo.ok);document.getElementById('app').innerHTML=`<div class="card"><h2>System Check</h2><div class="diagGrid"><div class="diagBox"><span>PWA</span><b>${V}</b></div><div class="diagBox"><span>Backend</span><b>${ok?esc(backendInfo.version):'Unavailable'}</b></div><div class="diagBox"><span>Connection</span><b class="${navigator.onLine?'pass':'warn'}">${navigator.onLine?'Online':'Offline'}</b></div><div class="diagBox"><span>Sync Queue</span><b>${pending}</b></div><div class="diagBox"><span>Games</span><b>${ok?backendInfo.games:'—'}</b></div><div class="diagBox"><span>Events</span><b>${ok?backendInfo.events:'—'}</b></div><div class="diagBox"><span>Check Time</span><b>${elapsed} ms</b></div><div class="diagBox"><span>Avg API</span><b>${avg||'—'}${avg?' ms':''}</b></div></div><div class="card" style="margin-top:10px"><div class="row"><span>Statistics cache</span><b>${ok?esc(backendInfo.cacheStatus||'Ready'):'—'}</b></div><div class="row"><span>Last API</span><b>${__perf.lastAction||'—'} ${__perf.lastApiMs?__perf.lastApiMs+' ms':''}</b></div><div class="row"><span>Overall</span><b class="${ok?'pass':'warn'}">${ok?'PASS':'CHECK CONNECTION'}</b></div>${err?`<div class="sub" style="margin-top:8px">${esc(err)}</div>`:''}</div></div><button class="full secondary" onclick="home()">Back to HQ</button>`}function showChangelog(){document.getElementById('app').innerHTML=`<div class="card changelogCard"><h2>What's New</h2><div class="changelogVer">v1.10.2 — Game Flow Stability</div><div class="changelogItem">✓ New games now open at the top of the Game Ready screen</div><div class="changelogItem">✓ Game Ready checklist disappears immediately after goalie selection</div><div class="changelogItem">✓ End Period advances locally without waiting for cloud sync</div><div class="changelogItem">✓ Slow cloud sync no longer causes an App timeout popup</div><div class="changelogItem">✓ Cloud pull cannot roll back an unsynced local period/goalie change</div><div class="changelogVer">v1.10.1 — Game Day Safety</div><div class="changelogItem">✓ Period 1 locked until a starting goalie is selected</div><div class="changelogItem">✓ Game Ready checklist</div><div class="changelogItem">✓ Active goalie displayed prominently</div><div class="changelogItem">✓ Optional Bench Notes in Live Game, Game Center and recap prompt</div><div class="changelogItem">✓ Live Game competition/home-away context</div><div class="changelogVer">v1.10.0.1 — SetupSync Hotfix</div><div class="changelogItem">✓ Fixed missing PWA_Schedule_v1 constant that caused setupSyncBackend ReferenceError</div><div class="changelogVer">v1.10.0 — Schedule + Competition</div><div class="changelogItem">✓ Add, edit, reschedule, postpone and cancel scheduled games</div><div class="changelogItem">✓ Start games directly from the schedule</div><div class="changelogItem">✓ Home/Away/Neutral and game type metadata</div><div class="changelogItem">✓ Regular Season / Tournament / Playoff / Exhibition stat filters</div><div class="changelogItem">✓ Tournament names stored separately</div><div class="changelogVer">v1.9.6.1 — Game Center Hotfix</div><div class="changelogItem">✓ Restored Game Timeline backend action</div><div class="changelogItem">✓ Restored Undo/void backend action</div><div class="changelogItem">✓ Game Center now refreshes completed games whenever online</div><div class="changelogItem">✓ Finalized games invalidate local list/stat caches after sync</div><div class="changelogVer">v1.9.6 — Foundation</div><div class="changelogItem">✓ Unified season statistics engine</div><div class="changelogItem">✓ Central client/backend caching</div><div class="changelogItem">✓ Automatic timeout/network retry for heavy screens</div><div class="changelogItem">✓ System Check diagnostics screen</div><div class="changelogItem">✓ Source-first release workflow</div><div class="changelogVer">v1.9.5 — Three Stars Clarity</div><div class="changelogItem">✓ Explicit First Star, Second Star and Third Star labels</div><div class="changelogItem">✓ Gold, silver and bronze ranking cues</div><div class="changelogItem">✓ Media Center Three Stars graphic now labels each ranking clearly</div><div class="changelogItem">✓ Includes the v1.9.4 Season Awards performance fix</div><div class="changelogVer">v1.9.4 — Season Awards Performance Fix</div><div class="changelogItem">✓ Season Awards now uses one consolidated backend calculation</div><div class="changelogItem">✓ Added backend caching and 30-second cold-start allowance</div><div class="changelogVer">v1.9.3 — Media Center Performance Fix</div><div class="changelogItem">✓ Media Center backend reduced to two Sheet reads</div><div class="changelogItem">✓ Removed repeated season recalculation that caused timeouts</div><div class="changelogItem">✓ Longer first-load allowance for Apps Script cold starts</div><div class="changelogVer">v1.9.2 — Media Center 2.0</div><div class="changelogItem">✓ Shared graphics design system</div><div class="changelogItem">✓ 2160×2160 high-resolution graphics</div><div class="changelogItem">✓ Team Leaders and Team Record graphics</div><div class="changelogItem">✓ Automatic hat trick / shutout milestone graphic</div><div class="changelogItem">✓ One-preview memory-friendly Media Center</div><div class="changelogVer">v1.9.1 — Arena + Media Polish</div><div class="changelogItem">✓ Arena/location added to games and score graphics</div><div class="changelogItem">✓ Player of the Game title centered</div><div class="changelogItem">✓ Three Stars game list now matches Game Center</div><div class="changelogVer">v1.9.0 — Media Center</div><div class="changelogItem">✓ Final Score share graphic</div><div class="changelogItem">✓ Three Stars share graphic</div><div class="changelogItem">✓ Player of the Game share graphic</div><div class="changelogItem">✓ Player Card watermark removed</div><div class="changelogVer">v1.8.2 — Header Scroll Fix</div><div class="changelogItem">✓ Dashboard logo now scrolls underneath the sticky banner correctly</div><div class="changelogVer">v1.8.1 — Professional Game Reports</div><div class="changelogItem">✓ Professional box score layout</div><div class="changelogItem">✓ Cleaner timeline presentation</div><div class="changelogItem">✓ Polished Three Stars cards</div><div class="changelogItem">✓ In-app changelog started</div><div class="changelogVer">v1.8.0 — Game Center 2.0</div><div class="changelogItem">✓ New Game Center</div><div class="changelogItem">✓ Branded final-score hero</div><div class="changelogItem">✓ Game Snapshot and Share</div><div class="changelogVer">v1.7.1 — Automatic Period Timing</div><div class="changelogItem">✓ Start/End Period workflow</div><div class="changelogItem">✓ Automatic period advance</div><div class="changelogItem">✓ Approximate game clock</div></div><button class="full secondary" onclick="home()">Back to HQ</button>`}
async function summary(c){loading('Loading Box Score');let d=await jsonp({action:'gameSummary',gameCode:c});if(!d.ok)throw new Error(d.error||'Could not load box score');document.getElementById('app').innerHTML=renderProfessionalBoxScore(d,c)}function fmtPim(v){v=Number(v||0);return v%1?v.toFixed(1):String(v)}
function goalieLine(g){return `#${g.jersey} ${g.name} — ${g.saves} saves on ${g.shots} shots (${(g.savePct*100).toFixed(1)}% SV%)`}
function buildBoxScore(r){let lines=[`LOCK MONSTERS ${r.game.teamGoals} — ${r.game.oppGoals} ${r.game.opponent}`,`${r.game.date} · ${r.game.result}`,``, `SCORING`];let scorers=r.skaters.filter(p=>p.points).sort((a,b)=>b.points-a.points||b.goals-a.goals);if(scorers.length)scorers.forEach(p=>lines.push(`#${p.jersey} ${p.name}: ${p.goals} G, ${p.assists} A, ${p.points} P`));else lines.push('No Lock Monsters scoring recorded.');lines.push('', 'GOALTENDING');let goalies=r.goalies.filter(g=>g.shots);if(goalies.length)goalies.forEach(g=>lines.push(goalieLine(g)));else lines.push('No goalie shots recorded.');lines.push('', 'PENALTIES');if(r.penalties.length)r.penalties.forEach(p=>lines.push(`#${p.jersey} ${p.name} — ${p.type}, ${p.displayMinutes}`));else lines.push('No penalties recorded.');lines.push('',`TEAM RECORD: ${r.season.record} · GF ${r.season.goalsFor} · GA ${r.season.goalsAgainst}`);return lines.join('\n')}
function buildSocialData(r){let scorers=r.skaters.filter(p=>p.points).sort((a,b)=>b.points-a.points||b.goals-a.goals).map(p=>`${p.name} ${p.goals}G/${p.assists}A`).join('; ')||'No Lock Monsters scoring recorded';let goalies=r.goalies.filter(g=>g.shots).map(goalieLine).join('; ')||'No goalie shots recorded';return `FINAL: Lock Monsters ${r.game.teamGoals}, ${r.game.opponent} ${r.game.oppGoals}\nScoring: ${scorers}\nGoalies: ${goalies}\nPenalties: ${r.penalties.length?r.penalties.map(p=>`${p.name} — ${p.type} ${p.displayMinutes}`).join('; '):'None recorded'}\nSeason record: ${r.season.record}`}
function buildChatGPTPrompt(r){let timeline=r.scoringTimeline.length?r.scoringTimeline.map(x=>x.text).join('\n'):'No scoring timeline recorded.';let penalties=r.penalties.length?r.penalties.map(p=>`- P${p.period}: #${p.jersey} ${p.name} — ${p.type}, ${p.displayMinutes}`).join('\n'):'- None recorded';let skaters=r.skaters.filter(p=>p.points||p.pim).sort((a,b)=>b.points-a.points||b.goals-a.goals).map(p=>`- #${p.jersey} ${p.name}: ${p.goals} G, ${p.assists} A, ${p.points} P, ${fmtPim(p.pim)} PIM`).join('\n')||'- No skater scoring or penalties recorded';let goalies=r.goalies.filter(g=>g.shots).map(g=>`- ${goalieLine(g)}`).join('\n')||'- No goalie shots recorded';let periods=r.periods.map(p=>`P${p.period}: Lock Monsters ${p.teamGoals}, ${r.game.opponent} ${p.oppGoals}`).join('\n')||'No period scoring recorded.';return `Write a polished postgame hockey package using ONLY the verified facts below.

STYLE:
Use energetic, concise sports-page and classic highlight-show pacing: strong headline, lively transitions, memorable but family-friendly phrasing, and a sense of momentum. Do not imitate any specific broadcaster, host, writer, or copyrighted catchphrase. Do not invent quotes, play descriptions, shot quality, crowd reactions, injuries, milestones, standings implications, or other facts that are not supplied.

OUTPUT EXACTLY THESE FOUR SECTIONS:
1. HEADLINE — one strong headline.
2. GAME STORY — 4 to 6 paragraphs suitable for parents/team website. Mention the most important scoring and goaltending performances naturally.
3. SOCIAL POST — approximately 80 to 130 words, ready to paste into a team social post.
4. BOX SCORE — concise, clean statistical summary.

VERIFIED GAME DATA
Team: Lockport Lock Monsters
Opponent: ${r.game.opponent}
Date: ${r.game.date}
Final: Lock Monsters ${r.game.teamGoals}, ${r.game.opponent} ${r.game.oppGoals}
Result: ${r.game.result}
Game type: ${r.game.gameType==='TOURNAMENT'?(r.game.tournamentName||'Tournament'):r.game.gameType==='PLAYOFF'?'Playoff':r.game.gameType==='EXHIBITION'?'Exhibition':'Regular Season'}
Arena: ${r.game.arena||'Not recorded'}
Bench notes: ${r.game.benchNotes||'None'}
Current season record after this game: ${r.season.record}
Season goals for / against: ${r.season.goalsFor} / ${r.season.goalsAgainst}

PERIOD SCORING
${periods}

LOCK MONSTERS PLAYER LINES
${skaters}

GOALTENDING
${goalies}

PENALTIES
${penalties}

SCORING TIMELINE
${timeline}

If the supplied data does not support a narrative claim, leave it out. Accuracy is more important than drama.`}
async function copyText(text,label){try{await navigator.clipboard.writeText(text);alert(label+' copied. Paste it into ChatGPT.')}catch(e){let ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert(label+' copied. Paste it into ChatGPT.')}}
async function postgameReport(c){loading('Building Postgame Report');let r=await jsonp({action:'postgameReport',gameCode:c});if(!r.ok){alert(r.error||'Could not build report');return}window.__report=r;let prompt=buildChatGPTPrompt(r),box=buildBoxScore(r),social=buildSocialData(r);window.__prompt=prompt;window.__box=box;window.__social=social;document.getElementById('app').innerHTML=`<div class="card"><img class="reportLogo" src="lock-monsters-logo.png" alt="Lock Monsters logo"><h2>📰 Postgame Report</h2><div class="reportMeta"><div><span class="sub">Final</span><b>${r.game.teamGoals}-${r.game.oppGoals}</b></div><div><span class="sub">Record</span><b>${esc(r.season.record)}</b></div></div><div class="sub" style="margin-top:10px">This prompt contains the verified game data and writing instructions. Copy it into ChatGPT to generate the full story.</div></div><div class="card"><h2>ChatGPT Recap Prompt</h2><div class="reportText">${esc(prompt)}</div><button class="full" style="margin-top:10px" onclick="copyText(window.__prompt,'ChatGPT recap prompt')">Copy ChatGPT Prompt</button></div><div class="card"><h2>Quick Copy</h2><div class="copyGrid"><button class="light" onclick="copyText(window.__box,'Box score')">Copy Box Score</button><button class="light" onclick="copyText(window.__social,'Social summary data')">Copy Social Data</button></div></div><button class="full secondary" onclick="summary('${c}')">Back to Box Score</button>`}

async function playerCards(){let sc=statScope(),k='stats_engine_'+sc,c=cacheGet(k);if(c){renderPlayerList({ok:true,players:c.players,goalies:c.goalies});return}if(!navigator.onLine){alert('Player cards need a connection.');return}loading('Building Player Cards…');let d=await jsonp({action:'statsEngine',scope:sc},30000,2);if(!d.ok)throw new Error(d.error||'Could not load player cards');cacheSet(k,d);renderPlayerList({ok:true,players:d.players,goalies:d.goalies})}
function showPlayerCard(i){let p=window.__players[i];let last=p.last5||[];document.getElementById('app').innerHTML=`<div class="playerCard"><div class="playerHead"><div><div class="sub">LOCK MONSTERS PLAYER</div><div style="font-size:22px;font-weight:900">${esc(p.name)}</div></div><div class="jerseyBig">#${p.jersey}</div></div><div class="statGrid"><div class="statBox"><b>${p.gamesPlayed}</b><span>GP</span></div><div class="statBox"><b>${p.goals}</b><span>Goals</span></div><div class="statBox"><b>${p.assists}</b><span>Assists</span></div><div class="statBox"><b>${p.points}</b><span>Points</span></div><div class="statBox"><b>${Number(p.pim||0).toFixed((p.pim||0)%1?1:0)}</b><span>PIM</span></div><div class="statBox"><b>${p.ppg.toFixed(2)}</b><span>PPG</span></div></div></div><div class="card"><h2>Last 5 Games</h2>${last.length?last.map(g=>`<div class="row"><span>${esc(easternGameLabel(g.date,g.gameTime))} - "${esc(g.opponent)}"</span><b>${g.goals}G ${g.assists}A ${g.points}P</b></div>`).join(''):'<div class="sub">No completed games yet.</div>'}</div><div class="card"><h2>Season Notes</h2><div class="row"><span>Best points game</span><b>${p.bestGamePoints} P</b></div><div class="row"><span>Penalty count</span><b>${p.penalties}</b></div></div><button class="full secondary" data-route="players">Back</button>`}
function renderThreeStarsGameList(d){document.getElementById('app').innerHTML=`<div class="card"><div class="gcSectionTitle"><h2>Three Stars</h2><span class="pill">${d.games.length} games</span></div>${d.games.length?d.games.map(g=>`<div class="gcListCard" onclick="threeStars('${g.gameCode}')"><div class="gcResult ${gameResultClass(g)}">${esc(g.result)}</div><div><div class="gcOpponent">vs ${esc(g.opponent)}</div><div class="gcDate">${esc(easternGameLabel(g.date,g.gameTime))}${g.arena?` · ${esc(g.arena)}`:''}</div></div><div class="gcScore"><b>${g.teamGoals}-${g.oppGoals}</b><span>VIEW STARS</span></div></div>`).join(''):'<div class="sub">No completed games yet.</div>'}</div><button class="full secondary" onclick="home()">Back to HQ</button>`}
async function threeStarsMenu(){if(!navigator.onLine){alert('Three Stars need a connection.');return}loading('Loading Three Stars');let d=await jsonp({action:'listGames'});if(!d.ok)throw new Error(d.error||'Could not load games');renderThreeStarsGameList(d)}async function threeStars(code){loading('Calculating Three Stars');let d=await jsonp({action:'threeStars',gameCode:code});if(!d.ok)throw new Error(d.error||'Could not calculate stars');document.getElementById('app').innerHTML=renderThreeStarsCards(d)+`<button class="full secondary" onclick="gameCenter('${code}')">Back to Game Center</button>`}async function seasonAwards(){if(!navigator.onLine){alert('Season Awards need a connection.');return}let sc=statScope(),k='stats_engine_'+sc;loading('Computing Season Awards…');let c=cacheGet(k),d=c?{ok:true,awards:c.awards}:await jsonp({action:'statsEngine',scope:sc},30000,2);if(!d.ok){alert(d.error||'Could not load awards');return}if(!c)cacheSet(k,d);document.getElementById('app').innerHTML=`${scopeSelectHTML('awards')}<div class="scopeNote">Awards based on ${scopeLabel(sc)} statistics.</div><div class="card"><img class="starLogo" src="lock-monsters-logo.png" alt="Lock Monsters logo"><h2>Season Awards</h2>${d.awards.map(a=>`<div class="awardCard"><div class="awardTitle">${esc(a.title)}</div><div class="awardWinner">#${a.jersey} ${esc(a.name)}</div><div class="awardReason">${esc(a.reason)}</div></div>`).join('')}</div><div class="card"><div class="sub">These awards are based only on recorded statistics. Subjective awards such as leadership or effort are intentionally left to the coaching staff.</div></div><button class="full secondary" onclick="home()">Back</button>`}
document.addEventListener('click',function(ev){
  const el=ev.target.closest('[data-route]');
  if(!el)return;
  ev.preventDefault();
  const route=el.getAttribute('data-route');
  let action;
  try{
    if(route==='live-game')action=gameMenu();
    else if(route==='season')action=season();
    else if(route==='players')action=playerCards();
    else if(route==='stars')action=threeStarsMenu();
    else if(route==='awards')action=seasonAwards();
    else if(route==='archives')action=archives();
    else if(route==='schedule')action=schedule();
    Promise.resolve(action).catch(err=>{
      console.error('Navigation async error',route,err);
      alert('Navigation error: '+(err&&err.message?err.message:String(err)));
    });
  }catch(err){
    console.error('Navigation error',route,err);
    alert('Navigation error: '+(err&&err.message?err.message:String(err)));
  }
});
